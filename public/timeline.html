<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Timeline - Portopro</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1e293b;
      overflow-x: hidden;
    }

    .main-content {
      width: calc(100% - 260px);
      min-height: 100vh;
      margin-left: 260px;
      padding: 30px;
    }

    .timeline-page {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* HEADER */

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-eyebrow {
      margin-bottom: 7px;
      color: #6366f1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .page-header h1 {
      margin: 0;
      color: #0f172a;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .page-header p {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    /* FILTER */

    .filter-card {
      display: grid;
      grid-template-columns:
        minmax(260px, 1fr)
        minmax(220px, 290px)
        auto;
      align-items: end;
      gap: 14px;
      margin-bottom: 20px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow:
        0 7px 24px
        rgba(15, 23, 42, 0.04);
    }

    .filter-field label {
      display: block;
      margin-bottom: 7px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    .filter-field input,
    .filter-field select {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      color: #1e293b;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .filter-field input:focus,
    .filter-field select:focus {
      border-color: #818cf8;
      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.12);
    }

    .filter-reset {
      min-height: 44px;
      padding: 0 18px;
      color: #475569;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-reset:hover {
      color: #4338ca;
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    /* TABLE CARD */

    .contract-table-card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 17px;
      box-shadow:
        0 8px 28px
        rgba(15, 23, 42, 0.05);
    }

    .contract-table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid #e8edf3;
    }

    .contract-table-header h2 {
      margin: 0;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
    }

    .contract-table-header p {
      margin: 5px 0 0;
      color: #64748b;
      font-size: 12px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .contract-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    .contract-table th {
      padding: 13px 16px;
      color: #64748b;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
      font-size: 10px;
      font-weight: 800;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .contract-table td {
      padding: 16px;
      color: #334155;
      background: #ffffff;
      border-bottom: 1px solid #edf1f5;
      font-size: 13px;
      line-height: 1.45;
      vertical-align: middle;
    }

    .contract-table tbody tr:last-child td {
      border-bottom: none;
    }

    .contract-table tbody tr:hover td {
      background: #fafbff;
    }

    /* PROYEK */

    .project-column {
      min-width: 260px;
      max-width: 380px;
    }

    .project-link {
      display: inline-block;
      color: #312e81;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.4;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .project-link:hover {
      color: #4f46e5;
      text-decoration: underline;
    }

    .project-category {
      display: block;
      margin-top: 4px;
      padding: 0;
      color: #64748b;
      background: transparent;
      border: none;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* JENIS PROYEK */

    .project-type {
      min-width: 180px;
    }

    .project-type-main {
      color: #1e293b;
      font-size: 13px;
      font-weight: 650;
    }

    .project-type-sub {
      margin-top: 4px;
      color: #64748b;
      font-size: 12px;
      font-weight: 400;
    }

    /* DATE */

    .date-column {
      min-width: 135px;
      color: #334155;
      white-space: nowrap;
    }

    /* BERAKHIR */

    .expiry-column {
      min-width: 175px;
    }

    .expiry-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .expiry-safe {
      color: #166534;
      background: #dcfce7;
    }

    .expiry-warning {
      color: #92400e;
      background: #fef3c7;
    }

    .expiry-expired {
      color: #991b1b;
      background: #fee2e2;
    }

    .expiry-finished {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .expiry-neutral {
      color: #475569;
      background: #f1f5f9;
    }

    /* EMPTY */

    .empty-state {
      padding: 60px 24px;
      color: #64748b;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      font-size: 13px;
      text-align: center;
    }

    /* PAGINATION */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
      padding: 14px 16px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
    }

    .pagination-info {
      color: #64748b;
      font-size: 12px;
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-button {
      min-width: 35px;
      height: 35px;
      padding: 0 10px;
      color: #475569;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .page-button:hover:not(:disabled),
    .page-button.active {
      color: #ffffff;
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .page-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    @media (max-width: 1024px) {
      .main-content {
        width: 100%;
        margin-left: 0;
        padding: 22px;
      }

      .filter-card {
        grid-template-columns: 1fr 1fr;
      }

      .filter-reset {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 640px) {
      .main-content {
        padding: 16px;
      }

      .page-header h1 {
        font-size: 24px;
      }

      .filter-card {
        grid-template-columns: 1fr;
      }

      .filter-reset {
        grid-column: auto;
      }

      .pagination {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="app-layout">

    <div id="sidebarContainer"></div>

    <main class="main-content">
      <div class="timeline-page">

        <header class="page-header">
          <div>

            <h1>Jangka Waktu</h1>

            <p>
              Monitoring periode dan masa berakhir proyek,
              lisensi, dan sewa.
            </p>
          </div>
        </header>

        <section class="filter-card">
          <div class="filter-field">
            <label for="timelineSearch">
              Cari Proyek atau Kategori
            </label>

            <input
              type="search"
              id="timelineSearch"
              placeholder="Masukkan nama proyek atau kategori..."
              autocomplete="off"
            >
          </div>

          <div class="filter-field">
            <label for="filterBerakhir">
              Berakhir Pada
            </label>

            <select id="filterBerakhir">
              <option value="">
                Semua Periode
              </option>

              <option value="1">
                Berakhir dalam 1 Bulan
              </option>

              <option value="3">
                Berakhir dalam 3 Bulan
              </option>

              <option value="6">
                Berakhir dalam 6 Bulan
              </option>

              <option value="expired">
                Sudah Jatuh Tempo
              </option>
            </select>
          </div>

          <button
            type="button"
            class="filter-reset"
            id="resetTimelineFilter"
          >
            Reset Filter
          </button>
        </section>

        <div id="timelineGroupedContainer">
          <div class="empty-state">
            Memuat Timeline...
          </div>
        </div>

        <div
          class="pagination"
          id="timelinePagination"
          style="display:none;"
        >
          <div
            class="pagination-info"
            id="timelinePaginationInfo"
          >
            -
          </div>

          <div
            class="pagination-buttons"
            id="timelinePaginationButtons"
          ></div>
        </div>

      </div>
    </main>
  </div>

  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/timeline.js"></script>
</body>

</html>
