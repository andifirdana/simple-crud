<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Task List - Portopro</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #1f2937;
    }

    .task-page {
      margin-left: 260px;
      width: calc(100% - 260px);
      min-width: 0;
      padding: 32px;
      box-sizing: border-box;
    }

    .task-header {
      margin-bottom: 24px;
    }

    .task-header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .task-header p {
      margin: 0;
      color: #6b7280;
    }

    /* =====================================================
       FORM TASK
    ===================================================== */

    .task-form-card {
      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      padding: 24px;

      margin-bottom: 24px;

      box-sizing: border-box;
    }

    .task-form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .task-form-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .task-form-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 16px;
    }

    .form-group {
      margin-bottom: 0;
    }

    .form-group.full {
      grid-column:
        1 / -1;
    }

    .form-group.span-2 {
      grid-column:
        span 2;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 600;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {

      width: 100%;

      box-sizing: border-box;

      padding: 11px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font: inherit;

      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {

      outline: none;

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(
          99,
          102,
          241,
          0.12
        );
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .readonly {
      background:
        #f9fafb !important;

      color: #6b7280;
    }

    .form-actions {
      display: flex;

      justify-content:
        flex-end;

      gap: 10px;

      margin-top: 20px;
    }

    .btn-primary {
      border: 0;

      padding: 11px 18px;

      border-radius: 9px;

      font-weight: 600;

      cursor: pointer;

      background: #4f46e5;
      color: white;
    }

    .btn-secondary {
      border:
        1px solid #d1d5db;

      padding: 10px 16px;

      border-radius: 9px;

      font-weight: 600;

      cursor: pointer;

      background: white;

      color: #374151;
    }

    /* =====================================================
       TABLE HEADER + FILTER
    ===================================================== */

    .task-card {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      background: white;

      border:
        1px solid #e5e7eb;

      border-radius: 16px;

      overflow: hidden;

      box-sizing: border-box;
    }

    .task-card-header {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 16px;

      padding: 18px 20px;

      border-bottom:
        1px solid #e5e7eb;
    }

    .task-card-title h2 {
      margin: 0 0 4px;

      font-size: 18px;
    }

    .task-card-title p {
      margin: 0;

      color: #6b7280;

      font-size: 13px;
    }

    .task-filter {
      width: 320px;
      max-width: 100%;
    }

    .task-filter input {
      width: 100%;

      box-sizing: border-box;

      padding: 10px 12px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font: inherit;
    }

    .task-filter input:focus {
      outline: none;

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(
          99,
          102,
          241,
          0.12
        );
    }

    /* =====================================================
       TABLE
    ===================================================== */

    .task-table-wrapper {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      overflow-x: auto;
      overflow-y: hidden;

      box-sizing: border-box;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 1800px;
    }

    th {
      text-align: left;

      padding: 15px;

      font-size: 12px;

      color: #6b7280;

      background: #f9fafb;

      border-bottom:
        1px solid #e5e7eb;

      white-space: nowrap;
    }

    td {
      padding: 15px;

      border-bottom:
        1px solid #f0f1f3;

      vertical-align: top;

      font-size: 14px;
    }

    .catatan-cell {
      max-width: 320px;
      min-width: 250px;

      white-space: normal;

      line-height: 1.5;
    }

    .task-name {
      font-weight: 600;
      min-width: 180px;
    }

    .status-select {
      width: 105px;
      min-width: 105px;

      height: 30px;

      padding:
        4px 22px
        4px 9px;

      border: none;
      outline: none;

      border-radius: 16px;

      font-size: 11px;

      font-weight: 600;

      cursor: pointer;

      box-sizing:
        border-box;
    }

    th:nth-child(8),
    td:nth-child(8) {
      width: 115px;
      min-width: 115px;
      max-width: 115px;
    }

    .status-not-started {
      background: #f3f4f6;
      color: #4b5563;
    }

    .status-on-progress {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-hold {
      background: #fef3c7;
      color: #92400e;
    }

    .status-done {
      background: #dcfce7;
      color: #166534;
    }
    .status-urgent {
  background: #fee2e2;
  color: #b91c1c;
}

    .action-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-edit,
    .btn-delete {

      border: 0;

      padding: 7px 10px;

      border-radius: 7px;

      cursor: pointer;
    }

    .btn-edit {
      background: #eef2ff;
      color: #4338ca;
    }

    .btn-delete {
      background: #fef2f2;
      color: #dc2626;
    }

    .task-table-wrapper::-webkit-scrollbar {
      height: 7px;
    }

    .task-table-wrapper::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    .task-table-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    @media (
      max-width: 1000px
    ) {

      .task-form-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }

    @media (
      max-width: 700px
    ) {

      .task-form-grid {
        grid-template-columns:
          1fr;
      }

      .form-group.full,
      .form-group.span-2 {
        grid-column: auto;
      }

      .task-card-header {
        flex-direction:
          column;

        align-items:
          stretch;
      }

      .task-filter {
        width: 100%;
      }

    }

  /* =====================================================
   CHECKBOX OPTION
  ===================================================== */

.task-options {
  grid-column: 1 / -1;

  display: flex;
  align-items: center;
  flex-wrap: wrap;

  gap: 12px;

  padding: 14px 16px;

  background: #f8fafc;

  border:
    1px solid #e5e7eb;

  border-radius: 10px;
}

.task-option {
  display: inline-flex;
  align-items: center;

  gap: 8px;

  padding: 8px 12px;

  border:
    1px solid #e5e7eb;

  border-radius: 8px;

  background: white;

  cursor: pointer;

  font-size: 13px;
  font-weight: 600;

  user-select: none;
}

.task-option input {
  width: auto !important;
  margin: 0;
}

.task-option.urgent {
  color: #b91c1c;

  background: #fff7f7;

  border-color: #fecaca;
}


/* =====================================================
   SUB FORM
===================================================== */

.task-sub-form {
  grid-column: 1 / -1;

  padding: 18px;

  border:
    1px solid #e5e7eb;

  border-radius: 12px;

  background: #f8fafc;
}

.task-sub-form-title {
  margin-bottom: 16px;

  font-size: 14px;
  font-weight: 700;

  color: #374151;
}

.task-sub-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0, 1fr)
    );

  gap: 16px;
}

.task-document-grid {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 16px;
}


/* =====================================================
   RESPONSIVE SUB FORM
===================================================== */

@media (max-width: 900px) {

  .task-sub-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );
  }

}

@media (max-width: 650px) {

  .task-sub-grid,
  .task-document-grid {
    grid-template-columns:
      1fr;
  }

  .task-options {
    flex-direction:
      column;

    align-items:
      stretch;
  }

}

  </style>

</head>


<body>


  <!-- SIDEBAR -->

  <div id="sidebarContainer"></div>


  <div class="task-page">


    <!-- HEADER -->

    <div class="task-header">

      <h1>
        Task List
      </h1>

      <p>
        Kelola aktivitas dan target
        pekerjaan proyek.
      </p>

    </div>


    <!-- =====================================================
     FORM TAMBAH / EDIT TASK
====================================================== -->

<div
  class="task-form-card"
  id="taskFormCard"
>

  <div class="task-form-header">

    <div>

      <h2 id="formTitle">
        Tambah Task
      </h2>

    </div>

  </div>


  <form id="taskForm">


    <input
      type="hidden"
      id="taskId"
    >


    <div class="task-form-grid">


      <!-- =================================================
           PROYEK
      ================================================== -->

      <div class="form-group">

        <label>
          Nama Proyek
        </label>

        <select
          id="proyekId"
          required
        >

          <option value="">
            Pilih Proyek
          </option>

        </select>

      </div>


      <!-- =================================================
           KATEGORI
      ================================================== -->

      <div class="form-group">

        <label>
          Kategori
        </label>

        <input
          id="kategori"
          class="readonly"
          type="text"
          readonly
        >

      </div>


      <!-- =================================================
           TARGET DATE
      ================================================== -->

      <div class="form-group">

        <label>
          Target Date
        </label>

        <input
          id="targetDate"
          type="date"
        >

      </div>


      <!-- =================================================
           TASK
      ================================================== -->

      <div
        class="
          form-group
          span-2
        "
      >

        <label>
          Task
        </label>

        <input
          id="task"
          type="text"
          required
          placeholder="Masukkan task..."
        >

      </div>


      <!-- =================================================
           LINK
      ================================================== -->

      <div class="form-group">

        <label>
          Link
        </label>

        <input
          id="link"
          type="url"
          placeholder="https://..."
        >

      </div>


      <!-- =================================================
           CATATAN
      ================================================== -->

      <div
        class="
          form-group
          full
        "
      >

        <label>
          Catatan
        </label>

        <textarea
          id="catatan"
          placeholder="Tuliskan catatan pekerjaan..."
        ></textarea>

      </div>


      <!-- =================================================
           PILIHAN TASK
      ================================================== -->

      <div class="task-options">


        <!-- DOKUMEN -->

        <label class="task-option">

          <input
            type="checkbox"
            id="adaDokumen"
          >

          Dokumen

        </label>


        <!-- URGENT -->

        <label
          class="
            task-option
            urgent
          "
        >

          <input
            type="checkbox"
            id="urgentTask"
          >

          Urgent

        </label>


        <!-- PEMBAYARAN -->

        <label class="task-option">

          <input
            type="checkbox"
            id="adaPembayaran"
          >

          Tambah Pembayaran / Termin

        </label>


      </div>


      <!-- =================================================
           DETAIL DOKUMEN
      ================================================== -->

      <div
        id="dokumenGroup"
        class="task-sub-form"
        style="display:none;"
      >

        <div class="task-sub-form-title">
          Dokumen
        </div>


        <div class="task-document-grid">


          <div class="form-group">

            <label>
              Kode Dokumen
            </label>

            <select id="masterDokumenId">

              <option value="">
                Pilih Dokumen
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Nomor Dokumen
            </label>

            <input
              id="nomorDokumen"
              type="text"
              placeholder="Contoh: 012/FSD/MTM/IX/2026"
            >

          </div>


        </div>

      </div>


      <!-- =================================================
           DETAIL PEMBAYARAN
      ================================================== -->

      <div
        id="pembayaranGroup"
        class="task-sub-form"
        style="display:none;"
      >

        <div class="task-sub-form-title">
          Tambah Termin Pembayaran
        </div>


        <div class="task-sub-grid">


          <!-- JENIS -->

          <div class="form-group">

            <label>
              Tambah Termin Untuk
            </label>

            <select id="jenisPembayaran">

              <option value="">
                Pilih
              </option>

              <option value="klien">
                Klien
              </option>

              <option value="partner">
                Partner
              </option>

            </select>

          </div>


          <!-- TARGET -->

          <div class="form-group">

            <label id="labelTargetPembayaran">
              Klien / Partner
            </label>

            <select id="targetPembayaran">

              <option value="">
                Pilih terlebih dahulu
              </option>

            </select>

          </div>


          <!-- NAMA TERMIN -->

          <div class="form-group">

            <label>
              Nama Termin
            </label>

            <input
              id="namaTerminTask"
              type="text"
              placeholder="Contoh: Termin 1"
            >

          </div>


          <!-- PERSENTASE -->

          <div
            class="form-group"
            id="terminPersentaseGroup"
          >

            <label>
              Persentase (%)
            </label>

            <input
              id="persentaseTerminTask"
              type="number"
              min="0"
              max="100"
              step="0.01"
              placeholder="0"
            >

          </div>


          <!-- NOMINAL -->

          <div
            class="form-group"
            id="terminNominalGroup"
            style="display:none;"
          >

            <label>
              Nominal
            </label>

            <input
              id="nominalTerminTask"
              type="number"
              min="0"
              step="1"
              placeholder="0"
            >

          </div>


          <!-- STATUS PEMBAYARAN -->

          <div class="form-group">

            <label>
              Status Pembayaran
            </label>

            <select id="statusPembayaranTask">

              <option value="Belum Dibayar">
                Belum Dibayar
              </option>

              <option value="Dibayar">
                Dibayar
              </option>

            </select>

          </div>


          <!-- JATUH TEMPO -->

          <div class="form-group">

            <label>
              Tanggal Jatuh Tempo
            </label>

            <input
              id="jatuhTempoTerminTask"
              type="date"
            >

          </div>


          <!-- TANGGAL BAYAR -->

          <div class="form-group">

            <label>
              Tanggal Bayar
            </label>

            <input
              id="tanggalBayarTerminTask"
              type="date"
            >

          </div>


        </div>

      </div>


      <!-- =================================================
           STATUS
           HANYA MUNCUL SAAT EDIT
      ================================================== -->

      <div
        class="form-group"
        id="statusGroup"
        style="display:none;"
      >

        <label>
          Status
        </label>

        <select id="status">

          <option value="Not Started">
            Not Started
          </option>

          <option value="On Progress">
            On Progress
          </option>

          <option value="Hold">
            Hold
          </option>

          <option value="Urgent">
            Urgent
          </option>

          <option value="Done">
            Done
          </option>

        </select>

      </div>


    </div>


    <!-- =================================================
         ACTION
    ================================================== -->

    <div class="form-actions">


      <button
        type="button"
        id="batalButton"
        class="btn-secondary"
        style="display:none;"
      >
        Batal Edit
      </button>


      <button
        type="submit"
        id="simpanTaskButton"
        class="btn-primary"
      >
        Simpan Task
      </button>


    </div>


  </form>

</div>
    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="task-card">


      <div class="task-card-header">


        <div class="task-card-title">

          <h2>
            Daftar Task
          </h2>

          <p>
            Seluruh task proyek.
          </p>

        </div>


        <div class="task-filter">

          <input
            type="search"
            id="searchProyek"
            placeholder="Cari nama proyek..."
            autocomplete="off"
          >

        </div>


      </div>


      <div class="task-table-wrapper">

        <table>

          <thead>

            <tr>

              <th>Proyek</th>
              <th>Kategori</th>
              <th>Task</th>
              <th>Catatan</th>
              <th>Link</th>
              <th>Dokumen</th>
              <th>Nomor Dokumen</th>
              <th>Status</th>
              <th>Tanggal Mulai</th>
              <th>Target Date</th>
              <th>Tanggal Selesai</th>
              <th>Dibuat Oleh</th>
              <th>Aksi</th>

            </tr>

          </thead>


          <tbody id="taskTableBody">

            <tr>

              <td colspan="13">
                Memuat task...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


  </div>


  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/task.js"></script>

</body>

</html>
