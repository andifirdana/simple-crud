<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Activity Log - Portopro</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    /* =====================================================
       PAGE
    ===================================================== */

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #1f2937;
    }


    .activity-page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      box-sizing: border-box;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }


    .page-header h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 750;
      color: #111827;
    }


    .page-header p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }


    /* =====================================================
       BUTTON
    ===================================================== */

    .btn-refresh {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;

      padding: 10px 16px;

      border-radius: 8px;

      font-size: 13px;
      font-weight: 650;

      cursor: pointer;

      transition: 0.2s;
    }


    .btn-refresh:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 20px;
    }


    .summary-card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 18px;

      box-shadow:
        0 1px 2px rgba(0,0,0,0.03);
    }


    .summary-label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }


    .summary-value {
      font-size: 26px;
      font-weight: 750;
      color: #111827;
    }


    /* =====================================================
       FILTER
    ===================================================== */

    .filter-card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 18px;

      margin-bottom: 20px;

      box-shadow:
        0 1px 2px rgba(0,0,0,0.03);
    }


    .filter-grid {
      display: grid;

      grid-template-columns:
        minmax(220px, 1.5fr)
        minmax(160px, 1fr)
        minmax(160px, 1fr)
        minmax(160px, 1fr)
        minmax(150px, 1fr);

      gap: 12px;

      align-items: end;
    }


    .form-group {
      min-width: 0;
    }


    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 12px;
      font-weight: 650;
    }


    .form-control {
      width: 100%;
      height: 42px;

      padding: 0 12px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      background: #ffffff;
      color: #111827;

      font-size: 13px;

      box-sizing: border-box;

      outline: none;
    }


    .form-control:focus {
      border-color: #6b7280;
    }


    /* =====================================================
       CONTENT CARD
    ===================================================== */

    .content-card {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 1px 2px rgba(0,0,0,0.03);
    }


    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;

      padding: 18px 20px;

      border-bottom: 1px solid #e5e7eb;
    }


    .content-header h2 {
      margin: 0;
      font-size: 16px;
      color: #111827;
    }


    .content-count {
      font-size: 12px;
      color: #6b7280;
    }


    /* =====================================================
       ACTIVITY LIST
    ===================================================== */

    .activity-list {
      display: flex;
      flex-direction: column;
    }


    .activity-item {
      display: grid;

      grid-template-columns:
        52px
        minmax(0, 1fr)
        190px;

      gap: 16px;

      padding: 20px;

      border-bottom: 1px solid #f0f1f3;
    }


    .activity-item:last-child {
      border-bottom: none;
    }


    .activity-item:hover {
      background: #fafbfc;
    }


    /* =====================================================
       AVATAR
    ===================================================== */

    .activity-avatar {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: #eef2ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: 750;

      color: #4338ca;
    }


    /* =====================================================
       ACTIVITY CONTENT
    ===================================================== */

    .activity-user {
      font-size: 14px;
      font-weight: 750;
      color: #111827;
    }


    .activity-description {
      margin-top: 3px;

      font-size: 13px;
      line-height: 1.6;

      color: #4b5563;
    }


    .entity-name {
      color: #111827;
      font-weight: 650;
    }


    /* =====================================================
       BADGE
    ===================================================== */

    .activity-meta {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 9px;
    }


    .badge {
      display: inline-flex;
      align-items: center;

      padding: 4px 8px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 700;

      background: #f3f4f6;
      color: #4b5563;
    }


    .badge-create {
      background: #ecfdf5;
      color: #047857;
    }


    .badge-update {
      background: #eff6ff;
      color: #1d4ed8;
    }


    .badge-delete {
      background: #fef2f2;
      color: #b91c1c;
    }


    /* =====================================================
       CHANGE VALUE
    ===================================================== */

    .change-box {
      margin-top: 12px;

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        32px
        minmax(0, 1fr);

      gap: 8px;

      align-items: center;
    }


    .change-value {
      border: 1px solid #e5e7eb;

      background: #f9fafb;

      border-radius: 8px;

      padding: 9px 10px;

      min-width: 0;
    }


    .change-label {
      display: block;

      margin-bottom: 3px;

      font-size: 9px;
      font-weight: 700;

      text-transform: uppercase;

      color: #9ca3af;
    }


    .change-text {
      display: block;

      font-size: 12px;
      color: #374151;

      word-break: break-word;
    }


    .change-arrow {
      text-align: center;

      color: #9ca3af;
      font-size: 16px;
    }


    /* =====================================================
       DATE
    ===================================================== */

    .activity-date {
      text-align: right;

      color: #6b7280;

      font-size: 11px;

      line-height: 1.6;
    }


    .activity-date strong {
      display: block;

      color: #374151;

      font-size: 12px;
    }


    /* =====================================================
       EMPTY / LOADING
    ===================================================== */

    .empty-state {
      padding: 60px 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 13px;
    }


    .loading {
      padding: 50px;

      text-align: center;

      color: #6b7280;

      font-size: 13px;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (
      max-width: 1100px
    ) {

      .summary-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }


      .filter-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (
      max-width: 700px
    ) {

      .summary-grid,
      .filter-grid {
        grid-template-columns: 1fr;
      }


      .page-header {
        flex-direction: column;
      }


      .activity-item {
        grid-template-columns:
          44px
          minmax(0, 1fr);
      }


      .activity-date {
        grid-column:
          2;

        text-align: left;
      }


      .change-box {
        grid-template-columns: 1fr;
      }


      .change-arrow {
        transform:
          rotate(90deg);
      }

    }

  </style>

</head>


<body>

  <div class="app-layout">

    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>


    <!-- MAIN -->
    <main class="main-content">

      <div class="activity-page">


        <!-- ==========================================
             HEADER
        =========================================== -->

        <div class="page-header">

          <div>

            <h1>
              Activity Log
            </h1>

            <p>
              Monitoring aktivitas dan perubahan data oleh masing-masing PIC.
            </p>

          </div>


          <button
            type="button"
            class="btn-refresh"
            id="btnRefresh"
          >
            Refresh
          </button>

        </div>


        <!-- ==========================================
             SUMMARY
        =========================================== -->

        <div class="summary-grid">

          <div class="summary-card">

            <div class="summary-label">
              Total Aktivitas
            </div>

            <div
              class="summary-value"
              id="totalActivity"
            >
              0
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-label">
              Aktivitas Hari Ini
            </div>

            <div
              class="summary-value"
              id="activityToday"
            >
              0
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-label">
              PIC Aktif
            </div>

            <div
              class="summary-value"
              id="totalPic"
            >
              0
            </div>

          </div>


          <div class="summary-card">

            <div class="summary-label">
              Perubahan Data
            </div>

            <div
              class="summary-value"
              id="totalUpdate"
            >
              0
            </div>

          </div>

        </div>


        <!-- ==========================================
             FILTER
        =========================================== -->

        <div class="filter-card">

          <div class="filter-grid">


            <div class="form-group">

              <label>
                Pencarian
              </label>

              <input
                type="text"
                id="searchActivity"
                class="form-control"
                placeholder="Cari PIC, task, proyek, aktivitas..."
              >

            </div>


            <div class="form-group">

              <label>
                PIC
              </label>

              <select
                id="filterPic"
                class="form-control"
              >
                <option value="">
                  Semua PIC
                </option>
              </select>

            </div>


            <div class="form-group">

              <label>
                Modul
              </label>

              <select
                id="filterModul"
                class="form-control"
              >

                <option value="">
                  Semua Modul
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Aktivitas
              </label>

              <select
                id="filterAktivitas"
                class="form-control"
              >

                <option value="">
                  Semua Aktivitas
                </option>

                <option value="CREATE">
                  CREATE
                </option>

                <option value="UPDATE">
                  UPDATE
                </option>

                <option value="DELETE">
                  DELETE
                </option>

              </select>

            </div>


            <div class="form-group">

              <label>
                Tanggal
              </label>

              <input
                type="date"
                id="filterTanggal"
                class="form-control"
              >

            </div>

          </div>

        </div>


        <!-- ==========================================
             LOG
        =========================================== -->

        <div class="content-card">

          <div class="content-header">

            <h2>
              Riwayat Aktivitas
            </h2>

            <div
              class="content-count"
              id="activityCount"
            >
              0 aktivitas
            </div>

          </div>


          <div
            id="activityList"
            class="activity-list"
          >

            <div class="loading">
              Memuat activity log...
            </div>

          </div>

        </div>


      </div>

    </main>

  </div>


  <!-- ================================================
       SCRIPT
  ================================================= -->

  <script src="/layout.js"></script>

  <script src="/sidebar.js"></script>

  <script src="/activity-log.js"></script>

</body>

</html>
