<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master Data Klien</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 40px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    .header-title p {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .badge {
      background: #eef2ff;
      color: #4338ca;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 35px 40px;
    }


    /* =========================
       CARD
    ========================= */

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 1px 2px rgba(0,0,0,.03),
        0 4px 12px rgba(0,0,0,.03);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }


    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #4b5563;
    }

    .form-group input {
      width: 100%;

      padding: 11px 13px;

      border:
        1px solid #d1d5db;

      border-radius: 8px;

      font-size: 14px;

      outline: none;

      transition: .2s;
    }

    .form-group input:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);
    }


    /* =========================
       BUTTON
    ========================= */

    .form-action {
      margin-top: 20px;

      display: flex;
      justify-content: flex-end;
    }

    .btn-primary {
      border: none;

      background: #4f46e5;
      color: white;

      padding: 11px 22px;

      border-radius: 8px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }


    /* =========================
       TABLE HEADER
    ========================= */

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .table-header h2 {
      font-size: 16px;
    }

    .table-header span {
      font-size: 12px;
      color: #6b7280;
    }


    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead {
      background: #f9fafb;
    }

    th {
      padding: 13px 14px;

      text-align: left;

      color: #6b7280;

      font-size: 11px;
      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: .04em;

      border-bottom:
        1px solid #e5e7eb;

      white-space: nowrap;
    }

    td {
      padding: 15px 14px;

      border-bottom:
        1px solid #f0f0f0;

      vertical-align: middle;

      white-space: nowrap;
    }

    tbody tr {
      transition: .15s;
    }

    tbody tr:hover {
      background: #f9fafb;
    }


    /* =========================
       DELETE BUTTON
    ========================= */

    td button {
      border: none;

      background: #fef2f2;
      color: #dc2626;

      padding: 7px 12px;

      border-radius: 6px;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    td button:hover {
      background: #fee2e2;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

      .form-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      .container {
        padding: 20px;
      }

      .header {
        padding: 18px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


<!-- HEADER -->

<div class="header">

  <div class="header-title">

    <h1>Master Data Klien</h1>

    <p>
      Kelola informasi perusahaan dan PIC
    </p>

  </div>

  <div class="badge">
    Client Management
  </div>

</div>



<div class="container">


  <!-- =========================
       FORM INPUT
  ========================== -->

  <div class="card">

    <div class="card-title">
      Tambah Data Klien
    </div>


    <form id="dataForm">


      <div class="form-grid">


        <div class="form-group">

          <label>
            Perusahaan / Klien
          </label>

          <input
            type="text"
            id="perusahaan_klien"
            placeholder="PT ABC Indonesia"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Inisial
          </label>

          <input
            type="text"
            id="inisial"
            placeholder="ABC"
          >

        </div>


        <div class="form-group">

          <label>
            Nama PIC
          </label>

          <input
            type="text"
            id="nama_pic"
            placeholder="Nama PIC"
          >

        </div>


        <div class="form-group">

          <label>
            No. Handphone
          </label>

          <input
            type="tel"
            id="no_pic"
            placeholder="0812XXX"
            inputmode="numeric"
            maxlength="15"
          >

        </div>


        <div class="form-group">

          <label>
            Email PIC
          </label>

          <input
            type="email"
            id="email_pic"
            placeholder="nama@perusahaan.com"
          >

        </div>


      </div>


      <div class="form-action">

        <button
          type="submit"
          class="btn-primary"
        >
          + Simpan Data
        </button>

      </div>


    </form>

  </div>



  <!-- =========================
       DATA TABLE
  ========================== -->

  <div class="card">


    <div class="table-header">

      <div>

        <h2>
          Daftar Klien
        </h2>

        <span>
          Data perusahaan dan PIC
        </span>

      </div>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>ID</th>

            <th>
              Perusahaan
            </th>

            <th>
              Inisial
            </th>

            <th>
              Nama PIC
            </th>

            <th>
              No. PIC
            </th>

            <th>
              Email PIC
            </th>

            <th>
              Created At
            </th>

            <th>
              Updated At
            </th>

            <th>
              Aksi
            </th>

          </tr>

        </thead>


        <tbody id="dataTable">
        </tbody>


      </table>

    </div>


  </div>


</div>


<script src="/app.js"></script>


</body>
</html>
