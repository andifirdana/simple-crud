<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Pendapatan - Portopro</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    :root {
      --page-bg: #f3f6fb;
      --surface: #ffffff;
      --line: #e5eaf2;
      --text: #172033;
      --muted: #64748b;
      --indigo: #4f46e5;
      --lebar-sidebar-pendapatan: 260px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* HALAMAN DAN SIDEBAR */

    .pendapatan-page {
      width: calc(
        100% - var(--lebar-sidebar-pendapatan)
      ) !important;
      min-width: 0;
      min-height: 100vh;
      margin-left:
        var(--lebar-sidebar-pendapatan) !important;
      padding: 28px;
      transition:
        width 180ms ease,
        margin-left 180ms ease;
    }

    .pendapatan-content {
      width: 100%;
      max-width: none !important;
      min-width: 0;
      margin: 0 !important;
    }

    /* KARTU RINGKASAN */

    .pendapatan-summary {
      display: grid !important;
      grid-template-columns:
        repeat(3, minmax(0, 1fr)) !important;
      gap: 16px;
      margin-bottom: 22px;
    }

    .pendapatan-summary .summary-card {
      position: relative;
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      grid-column: auto !important;
      min-width: 0;
      min-height: 175px;
      overflow: hidden;
      padding: 22px !important;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 19px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .pendapatan-summary .summary-card::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5px;
      background: var(--indigo);
      content: "";
    }

    .pendapatan-summary .summary-card.primary {
      color: #ffffff;
      background: linear-gradient(
        145deg,
        #1d2b63,
        #3730a3
      );
      border-color: transparent;
    }

    .pendapatan-summary .summary-card.primary::after {
      position: absolute;
      right: -35px;
      bottom: -65px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      content: "";
      pointer-events: none;
    }

    .pendapatan-summary .summary-top {
      position: relative;
      z-index: 1;
      display: flex !important;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
      margin: 0 0 20px !important;
    }

    .pendapatan-summary .summary-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: #4f46e5;
      background: #eef2ff;
    }

    .pendapatan-summary .summary-icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pendapatan-summary .summary-icon.amber {
      color: #d97706;
      background: #fffbeb;
    }

    .pendapatan-summary .summary-icon.blue {
      color: #2563eb;
      background: #eff6ff;
    }

    .pendapatan-summary .summary-icon.green {
      color: #059669;
      background: #ecfdf5;
    }

    .pendapatan-summary .summary-icon.rose {
      color: #e11d48;
      background: #fff1f2;
    }

    .pendapatan-summary .summary-card.primary
    .summary-icon {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
    }

    .pendapatan-summary .summary-tag {
      padding: 6px 9px;
      border-radius: 8px;
      color: #64748b;
      background: #f1f5f9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pendapatan-summary .summary-card.primary
    .summary-tag {
      color: #dbe2ff;
      background: rgba(255, 255, 255, 0.13);
    }

    .pendapatan-summary .summary-label {
      position: relative;
      z-index: 1;
      display: block !important;
      width: 100%;
      margin: 0 0 8px !important;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.4;
      text-align: left;
      text-transform: uppercase;
    }

    .pendapatan-summary .summary-card.primary
    .summary-label {
      color: #d2dcff;
    }

    .pendapatan-summary .summary-value {
      position: relative;
      z-index: 1;
      display: block !important;
      width: 100%;
      margin: 0 !important;
      color: var(--text);
      font-size: clamp(19px, 1.6vw, 28px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.035em;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .pendapatan-summary .summary-card.primary
    .summary-value {
      color: #ffffff;
    }

    #jumlahTerminDibayar,
    #jumlahTerminBelumDibayar {
      font-size: clamp(26px, 2vw, 34px);
    }

    /* FILTER */

    .pendapatan-filter-row {
      display: grid;
      grid-template-columns:
        minmax(220px, 1.7fr)
        minmax(120px, 0.8fr)
        minmax(105px, 0.7fr)
        minmax(155px, 1fr)
        minmax(165px, 1fr)
        minmax(100px, 0.65fr);
      align-items: end;
      gap: 12px;
      width: 100%;
      margin-bottom: 22px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .pendapatan-filter-field {
      min-width: 0;
    }

    .pendapatan-filter-field label,
    .pendapatan-filter-field .filter-label-spacer {
      display: block;
      height: 17px;
      margin-bottom: 8px;
      color: #64748b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pendapatan-filter-field input,
    .pendapatan-filter-field select,
    .pendapatan-filter-field button {
      width: 100%;
      height: 44px;
      min-width: 0;
      margin: 0;
      border: 1px solid #d7deea;
      border-radius: 11px;
      font-size: 12px;
    }

    .pendapatan-filter-field input,
    .pendapatan-filter-field select {
      padding: 0 12px;
      color: #334155;
      background: #ffffff;
    }

    .pendapatan-filter-field input:focus,
    .pendapatan-filter-field select:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px
        rgba(99, 102, 241, 0.12);
    }

    .pendapatan-filter-field button {
      color: #475569;
      background: #f8fafc;
      font-weight: 800;
      cursor: pointer;
    }

    .pendapatan-filter-field button:hover {
      color: #4338ca;
      background: #eef2ff;
    }

    /* TABEL */

    #pendapatanGroup {
      width: 100%;
      min-width: 0;
    }

    #pendapatanGroup .pendapatan-table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 17px;
      scrollbar-width: thin;
      scrollbar-color: #bdc8d9 transparent;
    }

    #pendapatanGroup .pendapatan-table {
      width: 100%;
      min-width: 1700px;
      border-collapse: separate;
      border-spacing: 0;
    }

    #pendapatanGroup .pendapatan-table th {
      padding: 13px 14px;
      color: #64748b;
      background: #f5f7fc;
      border-bottom: 1px solid var(--line);
      font-size: 10px;
      font-weight: 800;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #pendapatanGroup .pendapatan-table td {
      padding: 14px;
      color: #334155;
      background: #ffffff;
      border-bottom: 1px solid #edf0f5;
      font-size: 12px;
      font-weight: 400;
      text-align: left;
      vertical-align: middle;
    }

    #pendapatanGroup .pendapatan-table
    tbody tr:hover td {
      background: #f8faff;
    }

    #pendapatanGroup .pendapatan-table
    tbody tr:last-child td {
      border-bottom: 0;
    }

    #pendapatanGroup .pendapatan-table
    th:nth-child(2),
    #pendapatanGroup .pendapatan-table
    td:nth-child(2) {
      width: 260px;
      min-width: 260px;
      max-width: 260px;
    }

    #pendapatanGroup .pendapatan-project-link {
      display: block;
      max-width: 230px;
      overflow: hidden;
      color: #3449a5;
      font-weight: 700;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #pendapatanGroup
    a.pendapatan-project-link:hover {
      text-decoration: underline;
    }

    #pendapatanGroup .pendapatan-subtext {
      display: block;
      margin-top: 4px;
      color: #94a3b8;
      font-size: 11px;
    }

    #pendapatanGroup .pendapatan-table
    .amount {
      font-weight: 700;
      white-space: nowrap;
    }

    /* Nilai Kontrak tidak perlu bold */
    #pendapatanGroup .pendapatan-table
    td:nth-child(6) {
      font-weight: 400;
    }

    #pendapatanGroup .pendapatan-table
    .tanggal-cell,
    #pendapatanGroup .pendapatan-table
    .periode-cell,
    #pendapatanGroup .pendapatan-table
    .persentase-cell {
      white-space: nowrap;
    }

    #pendapatanGroup .pendapatan-table
    .deskripsi-cell,
    #pendapatanGroup .pendapatan-table
    .syarat-cell {
      min-width: 145px;
      max-width: 220px;
      overflow-wrap: anywhere;
    }

    #pendapatanGroup .pendapatan-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    #pendapatanGroup
    .pendapatan-status.sudah-dibayar {
      color: #16804a;
      background: #e8f7ee;
    }

    #pendapatanGroup
    .pendapatan-status.proses {
      color: #9a6500;
      background: #fff3d6;
    }

    #pendapatanGroup
    .pendapatan-status.belum-dibayar {
      color: #b42332;
      background: #feecec;
    }

    .empty-state {
      padding: 28px;
      color: #64748b;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
    }

    .error-state {
      color: #b42332;
    }

    /* PAGINATION */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      color: #64748b;
      font-size: 12px;
    }

    .pagination-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pagination-buttons button {
      min-width: 34px;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #d7deea;
      border-radius: 9px;
      color: #475569;
      background: #ffffff;
      cursor: pointer;
    }

    .pagination-buttons button.active {
      color: #ffffff;
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .pagination-buttons button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* RESPONSIVE */

    @media (max-width: 1150px) {
      .pendapatan-filter-row {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      .pendapatan-filter-field.pencarian {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .pendapatan-page {
        width: 100% !important;
        margin-left: 0 !important;
        padding: 14px;
      }

      .pendapatan-summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr)) !important;
      }

      .pendapatan-filter-row {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .pendapatan-filter-field.pencarian,
      .pendapatan-filter-field.reset-field {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .pendapatan-summary {
        grid-template-columns: 1fr !important;
      }

      .pendapatan-filter-row {
        grid-template-columns: 1fr;
      }

      .pendapatan-filter-field.pencarian,
      .pendapatan-filter-field.reset-field {
        grid-column: auto;
      }

      .pagination {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    .pendapatan-summary {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: 12px !important;
  margin-bottom: 18px !important;
}

.pendapatan-summary .summary-card,
.pendapatan-summary .summary-card.primary {
  grid-column: auto !important;
  display: flex !important;
  flex-direction: column !important;
  justify-content: flex-start !important;
  min-width: 0 !important;
  min-height: 0 !important;
  height: auto !important;
  aspect-ratio: auto !important;
  padding: 14px 16px !important;
}

.pendapatan-summary .summary-top {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  width: 100% !important;
  margin: 0 0 10px !important;
}

.pendapatan-summary .summary-icon {
  width: 36px !important;
  height: 36px !important;
  flex: 0 0 36px !important;
}

.pendapatan-summary .summary-label {
  display: block !important;
  width: 100% !important;
  margin: 0 0 4px !important;
  font-size: 10px !important;
  line-height: 1.3 !important;
}

.pendapatan-summary .summary-value,
.pendapatan-summary #jumlahTerminDibayar,
.pendapatan-summary #jumlahTerminBelumDibayar {
  display: block !important;
  width: 100% !important;
  margin: 0 !important;
  font-size: clamp(17px, 1.4vw, 23px) !important;
  line-height: 1.25 !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

@media (max-width: 900px) {
  .pendapatan-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }
}

@media (max-width: 600px) {
  .pendapatan-summary {
    grid-template-columns: 1fr !important;
  }
}
  </style>
</head>

<body>
  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="pendapatan-page">
      <div class="pendapatan-content">

        <section class="pendapatan-summary">
          <article class="summary-card primary">
            <div class="summary-top">
              <span class="summary-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3v18h18"></path>
                  <path d="m7 15 4-4 3 3 5-7"></path>
                </svg>
              </span>
              <span class="summary-tag">Accrual</span>
            </div>
            <span class="summary-label">
              Total Pendapatan
            </span>
            <span
              class="summary-value"
              id="totalPendapatan"
            >Rp 0</span>
          </article>

          <article class="summary-card">
            <div class="summary-top">
              <span class="summary-icon amber">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </span>
              <span class="summary-tag">Outstanding</span>
            </div>
            <span class="summary-label">
              Total Belum Ditagih
            </span>
            <span
              class="summary-value"
              id="totalBelumDibayar"
            >Rp 0</span>
          </article>

          <article class="summary-card">
            <div class="summary-top">
              <span class="summary-icon blue">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M20 12a8 8 0 1 1-2.34-5.66"
                  ></path>
                  <path d="M20 4v6h-6"></path>
                </svg>
              </span>
              <span class="summary-tag">On Process</span>
            </div>
            <span class="summary-label">
              Total Request Invoice
            </span>
            <span
              class="summary-value"
              id="totalProses"
            >Rp 0</span>
          </article>

          <article class="summary-card">
            <div class="summary-top">
              <span class="summary-icon green">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="m8 12 2.5 2.5L16 9"></path>
                </svg>
              </span>
              <span class="summary-tag">Paid</span>
            </div>
            <span class="summary-label">
              Termin Dibayar
            </span>
            <span
              class="summary-value"
              id="jumlahTerminDibayar"
            >0</span>
          </article>

          <article class="summary-card">
            <div class="summary-top">
              <span class="summary-icon rose">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 8v5"></path>
                  <path d="M12 17h.01"></path>
                </svg>
              </span>
              <span class="summary-tag">Unpaid</span>
            </div>
            <span class="summary-label">
              Termin Belum Dibayar
            </span>
            <span
              class="summary-value"
              id="jumlahTerminBelumDibayar"
            >0</span>
          </article>
        </section>

        <div class="pendapatan-filter-row">
          <div class="pendapatan-filter-field pencarian">
            <label for="searchPendapatan">
              Pencarian
            </label>
            <input
              id="searchPendapatan"
              type="search"
              placeholder="Cari proyek, klien, kategori atau termin..."
            >
          </div>

          <div class="pendapatan-filter-field">
            <label for="filterBulanPendapatan">
              Bulan
            </label>
            <select
              id="filterBulanPendapatan"
            ></select>
          </div>

          <div class="pendapatan-filter-field">
            <label for="filterTahunPendapatan">
              Tahun
            </label>
            <select
              id="filterTahunPendapatan"
            ></select>
          </div>

          <div class="pendapatan-filter-field">
            <label for="filterJenisPendapatan">
              Jenis Proyek
            </label>
            <select
              id="filterJenisPendapatan"
            ></select>
          </div>

          <div class="pendapatan-filter-field">
            <label
              for="filterStatusPembayaranPendapatan"
            >
              Status Pembayaran
            </label>
            <select
              id="filterStatusPembayaranPendapatan"
            ></select>
          </div>

          <div class="pendapatan-filter-field reset-field">
            <span
              class="filter-label-spacer"
              aria-hidden="true"
            >&nbsp;</span>
            <button
              id="resetPendapatanFilter"
              type="button"
            >
              Reset
            </button>
          </div>
        </div>

        <div id="pendapatanGroup">
          <div class="empty-state">
            Memuat data pendapatan...
          </div>
        </div>

        <div
          class="pagination"
          id="pendapatanPagination"
          style="display: none;"
        >
          <div
            class="pagination-info"
            id="pendapatanPaginationInfo"
          ></div>

          <div
            class="pagination-buttons"
            id="pendapatanPaginationButtons"
          ></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/pendapatan.js"></script>

  <script>
    (() => {
      const host =
        document.getElementById(
          "sidebarContainer"
        );

      if (!host) return;

      let sidebarTerpantau = null;

      const pengamatUkuran =
        new ResizeObserver(
          perbaruiLebarSidebar
        );

      function perbaruiLebarSidebar() {
        const sidebar =
          host.querySelector(
            "aside, .sidebar, .app-sidebar"
          );

        if (!sidebar) return;

        if (
          sidebarTerpantau !== sidebar
        ) {
          if (sidebarTerpantau) {
            pengamatUkuran.unobserve(
              sidebarTerpantau
            );
          }

          sidebarTerpantau = sidebar;
          pengamatUkuran.observe(
            sidebar
          );
        }

        const batas =
          sidebar.getBoundingClientRect();

        const lebarTerlihat =
          Math.max(
            0,
            Math.min(
              batas.right,
              window.innerWidth
            ) -
            Math.max(
              batas.left,
              0
            )
          );

        document.documentElement.style
          .setProperty(
            "--lebar-sidebar-pendapatan",
            `${Math.round(lebarTerlihat)}px`
          );
      }

      new MutationObserver(() => {
        requestAnimationFrame(
          perbaruiLebarSidebar
        );
      }).observe(
        host,
        {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: [
            "class",
            "style"
          ]
        }
      );

      window.addEventListener(
        "resize",
        perbaruiLebarSidebar
      );

      perbaruiLebarSidebar();
    })();
  </script>
</body>
</html>
