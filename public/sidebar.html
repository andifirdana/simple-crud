<style>
  /* ======================================================
   SIDEBAR SCROLL
====================================================== */

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;

  display: flex;
  flex-direction: column;

  width: 260px;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;
}


/* Logo dan informasi user tidak ikut mengecil */

.sidebar .logo,
.sidebar .sidebar-user {
  flex: 0 0 auto;
}


/* Hanya bagian menu yang di-scroll */

.sidebar .menu {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;

  padding-right: 6px;

  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color:
    rgba(148, 163, 184, 0.65)
    transparent;
}


/* Scrollbar Chrome, Edge, dan Safari */

.sidebar .menu::-webkit-scrollbar {
  width: 6px;
}

.sidebar .menu::-webkit-scrollbar-track {
  background: transparent;
}

.sidebar .menu::-webkit-scrollbar-thumb {
  background:
    rgba(148, 163, 184, 0.55);
  border-radius: 999px;
}

.sidebar .menu::-webkit-scrollbar-thumb:hover {
  background:
    rgba(100, 116, 139, 0.8);
}


/* Tombol logout tetap di bagian bawah */

.sidebar #logoutButton {
  flex: 0 0 auto;
  width: calc(100% - 32px);
  margin: 14px 16px 18px;
}
/* Sidebar */
.sidebar {
  background: linear-gradient(
    180deg,
    #073568 0%,
    #05264f 55%,
    #031c3c 100%
  );
  color: #ffffff;
  border-right: 1px solid #315a76;
}

/* Menu */
.sidebar a {
  background: transparent;
  color: #d2e4e9;
  border-radius: 10px;
  text-decoration: none;
  transition:
    background-color 0.2s,
    color 0.2s;
}

.sidebar a svg {
  color: inherit;
}

.sidebar a:hover {
  background: #174566;
  color: #ffffff;
}

/* Menu aktif */
.sidebar a.active,
.sidebar a[aria-current="page"] {
  background: #c7dcaf;
  color: #24432d;
  font-weight: 700;
  box-shadow: none;
}

.sidebar a.active:hover,
.sidebar a[aria-current="page"]:hover {
  background: #b8d19c;
  color: #24432d;
}

/* Tombol sidebar */
.sidebar button {
  background: #174566;
  color: #ffffff;
  border: 1px solid #47758b;
  border-radius: 10px;
  box-shadow: none;
}

.sidebar button:hover {
  background: #1c506f;
  border-color: #76a9b7;
}

/* Fokus keyboard */
.sidebar a:focus-visible,
.sidebar button:focus-visible {
  outline: 2px solid #85bfc6;
  outline-offset: 2px;
}

/* Scrollbar */
.sidebar {
  scrollbar-width: thin;
  scrollbar-color: #47758b #05264f;
}

.sidebar::-webkit-scrollbar {
  width: 6px;
}

.sidebar::-webkit-scrollbar-track {
  background: #05264f;
}

.sidebar::-webkit-scrollbar-thumb {
  background: #47758b;
  border-radius: 10px;
}

/* ==================================================
   SIDEBAR MINIMIZE / MAXIMIZE
================================================== */

body {
  --sidebar-width: 260px;
}

body.sidebar-collapsed {
  --sidebar-width: 64px;
}

.collapsible-sidebar {
  box-sizing: border-box;

  width: var(--sidebar-width);
  min-width: var(--sidebar-width);

  flex-shrink: 0;

  transition:
    width 0.25s ease,
    min-width 0.25s ease;
}

/* Tombol tetap terlihat saat sidebar mengecil */

.sidebar-toggle-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;

  padding: 12px;
}

.sidebar-toggle-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  width: 36px;
  height: 36px;

  flex-shrink: 0;

  padding: 0;

  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 10px;

  background: rgba(255, 255, 255, 0.12);
  color: inherit;

  font-family: inherit;
  font-size: 28px;
  line-height: 1;

  cursor: pointer;

  transition: background 0.2s ease;
}

.sidebar-toggle-button:hover {
  background: rgba(255, 255, 255, 0.24);
}

.sidebar-toggle-button:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 3px;
}

/* Sembunyikan isi sidebar, sisakan tombol */

body.sidebar-collapsed
.collapsible-sidebar > :not(.sidebar-toggle-bar) {
  display: none;
}

body.sidebar-collapsed .sidebar-toggle-bar {
  justify-content: center;
}

.main-content {
  margin-left: var(--sidebar-width);

  min-width: 0;

  transition: margin-left 0.25s ease;
}

@media (prefers-reduced-motion: reduce) {
  .collapsible-sidebar,
  .main-content {
    transition: none;
  }
}
/* ==================================================
   SIDEBAR MINIMIZE / MAXIMIZE
================================================== */

/* Logo dan tombol berada dalam satu baris */

#sidebar .sidebar-toggle-bar {

  justify-content: space-between;

  gap: 8px;

}

#sidebar .sidebar-toggle-bar .logo {

}

#sidebar .sidebar-toggle-button:hover {

}

#sidebar .sidebar-toggle-button:focus-visible {

}

/* Sidebar mengecil */

body.sidebar-collapsed #sidebar {
  padding-left: 12px;
  padding-right: 12px;
}

/* Sisakan baris tombol */

body.sidebar-collapsed
#sidebar > :not(.sidebar-toggle-bar) {
  display: none;
}

/* Logo ikut disembunyikan */

body.sidebar-collapsed
#sidebar .sidebar-toggle-bar .logo {
  display: none;
}

body.sidebar-collapsed
#sidebar .sidebar-toggle-bar {
  justify-content: center;
}

/* Untuk sidebar dengan position: fixed.
   Sesuaikan selector dengan pembungkus konten kamu. */

.main-content {
  margin-left: var(--sidebar-width);
  min-width: 0;

  transition: margin-left 0.25s ease;
}

@media (prefers-reduced-motion: reduce) {
  #sidebar,
  .main-content {
    transition: none;
  }
}
body.sidebar-collapsed {
  --sidebar-width: 64px;
}

body.sidebar-collapsed #sidebar {
  box-sizing: border-box;

  width: 64px !important;
  min-width: 64px !important;
  max-width: 64px !important;

  flex-basis: 64px !important;

  padding-left: 12px;
  padding-right: 12px;
}

body.sidebar-collapsed
#sidebar > :not(.sidebar-toggle-bar) {

}

#sidebar .sidebar-toggle-bar {
  display: flex !important;
  justify-content: center;
}

body.sidebar-collapsed
#sidebar .sidebar-toggle-bar .logo {
  display: none !important;
}

body.sidebar-collapsed .main-content {

}
/* ==================================================
   KELOMPOK SIDEBAR
================================================== */

.sidebar #sidebarMenu {
  display: block;

  min-width: 0;
  margin-top: 16px;
}

/* Kelompok */

.sidebar #sidebarMenu .sidebar-menu-group {
  display: block;

  margin: 0 0 6px;
  padding: 0;

  border: none;
  border-radius: 10px;

  background: transparent;
}

/* Judul kelompok yang dapat diklik */

.sidebar #sidebarMenu .sidebar-group-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;

  box-sizing: border-box;

  min-height: 42px;
  margin: 0;
  padding: 10px 12px;

  border: none;
  border-radius: 10px;

  background: rgba(255, 255, 255, 0.05);
  color: #e1edf8;

  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;

  list-style: none;

  cursor: pointer;

  transition:
    background 0.2s ease,
    color 0.2s ease;
}

.sidebar #sidebarMenu
.sidebar-group-heading::-webkit-details-marker {
  display: none;
}

.sidebar #sidebarMenu
.sidebar-group-heading::marker {
  content: "";
}

/* Panah */

.sidebar #sidebarMenu .sidebar-group-heading::after {
  content: "";

  width: 7px;
  height: 7px;

  flex-shrink: 0;

  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;

  transform: rotate(-45deg);

  transition: transform 0.2s ease;
}

.sidebar #sidebarMenu
.sidebar-menu-group[open] > .sidebar-group-heading::after {
  transform: rotate(45deg);
}

/* Hover dan kelompok terbuka */

.sidebar #sidebarMenu .sidebar-group-heading:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
}

.sidebar #sidebarMenu
.sidebar-menu-group[open] > .sidebar-group-heading {
  background: rgba(255, 255, 255, 0.09);
  color: #ffffff;
}

/* Penanda kelompok yang memiliki halaman aktif */

.sidebar #sidebarMenu
.has-active-menu > .sidebar-group-heading {
  color: #bfe9dc;
}

/* Isi kelompok */

.sidebar #sidebarMenu .sidebar-group-links {
  display: flex;
  flex-direction: column;

  gap: 3px;

  margin: 5px 0 8px 12px;
  padding: 0 0 0 9px;

  border-left: 1px solid rgba(255, 255, 255, 0.16);
}

/* Link menu: lebih ringkas */

.sidebar #sidebarMenu .sidebar-group-links > a {
  display: block;

  box-sizing: border-box;

  width: 100%;
  min-width: 0;
  min-height: 36px;

  margin: 0;
  padding: 9px 11px;

  border: none;
  border-radius: 8px;

  background: transparent;
  color: #cbddec;

  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;

  text-decoration: none;

  white-space: normal;
  overflow-wrap: anywhere;

  transition:
    background 0.2s ease,
    color 0.2s ease;
}

.sidebar #sidebarMenu .sidebar-group-links > a:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

/* Halaman aktif */

.sidebar #sidebarMenu .sidebar-group-links > a.active {
  background: #e8f4ee;
  color: #14543d;

  font-weight: 700;
}

/* Navigasi keyboard */

.sidebar #sidebarMenu .sidebar-group-heading:focus-visible,
.sidebar #sidebarMenu .sidebar-group-links > a:focus-visible {
  outline: 2px solid #a7dccc;
  outline-offset: 2px;
}
</style>
<aside
  id="sidebar"
  class="sidebar"
  aria-label="Menu utama"
>

  <div class="sidebar-toggle-bar">

    <div class="logo">
      Portopro
    </div>

    <button
      type="button"
      id="sidebarToggle"
      class="sidebar-toggle-button"
      title="Kecilkan sidebar"
      aria-label="Kecilkan sidebar"
      aria-controls="sidebarMenu"
      aria-expanded="true"
    >
      ‹
    </button>

  </div>

  <div class="sidebar-user">
    <strong id="userNama">User</strong>
  </div>

  <div class="sidebar-user">
    <span id="userRole">PIC</span>
  </div>

  <div
    class="menu"
    id="sidebarMenu"
  ></div>

  <button
    type="button"
    id="logoutButton"
  >
    Logout
  </button>

</aside>
<script src="/sidebar.js" defer></script>
