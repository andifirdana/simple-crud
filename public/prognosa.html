<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prognosa - Portopro</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      font-family: Inter, Arial, sans-serif;
    }

    .prognosa-page {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 32px;
      box-sizing: border-box;
    }

    .prognosa-header {
      margin-bottom: 24px;
    }

    .prognosa-header h1 {
      margin: 0 0 6px;
      font-size: 30px;
      color: #111827;
    }

    .prognosa-header p {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
    }


    /* SUMMARY */

    .prognosa-summary {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 20px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .summary-label {
      display: block;
      margin-bottom: 8px;
      color: #6b7280;
      font-size: 13px;
    }

    .summary-value {
      color: #111827;
      font-size: 23px;
      font-weight: 700;
    }


    /* FILTER */

    .filter-card {
      display: flex;
      gap: 12px;
      flex-wrap: nowrap;

      padding: 18px;
      margin-bottom: 20px;

      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .filter-card input,
    .filter-card select {
      min-height: 40px;
      padding: 8px 12px;

      background: white;
      border: 1px solid #d1d5db;
      border-radius: 8px;

      box-sizing: border-box;
      font: inherit;
    }

    #searchPrognosa {
      flex: 1;
      min-width: 240px;
    }


    /* GROUP */

    .jenis-group {
      margin-bottom: 22px;

      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;

      overflow: hidden;
    }

    .jenis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 20px;

      background: #111827;
      color: white;
    }

    .jenis-title {
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .jenis-total {
      font-size: 14px;
      font-weight: 700;
    }


    /* SUB JENIS */

    .subjenis-group {
      border-bottom: 1px solid #e5e7eb;
    }

    .subjenis-group:last-child {
      border-bottom: none;
    }

    .subjenis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 14px 20px;

      background: #f8fafc;

      border-bottom: 1px solid #e5e7eb;
    }

    .subjenis-title {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .subjenis-total {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }


    /* KATEGORI */

    .kategori-group {
      margin: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
    }

    .kategori-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 13px 16px;

      background: #eef2ff;

      color: #3730a3;
    }

    .kategori-title {
      font-size: 13px;
      font-weight: 700;
    }

    .kategori-total {
      font-size: 12px;
      font-weight: 700;
    }


    /* TABLE */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .prognosa-table {
      width: 100%;
      min-width: 1450px;
      border-collapse: collapse;
    }

    .prognosa-table th {
      padding: 12px 14px;

      text-align: left;

      background: #f9fafb;

      border-bottom:
        1px solid #e5e7eb;

      color: #64748b;

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }

    .prognosa-table td {
      padding: 14px;

      border-bottom:
        1px solid #f1f5f9;

      color: #374151;

      font-size: 12px;

      vertical-align: middle;
    }

    .prognosa-table tbody tr:hover {
      background: #fafafa;
    }

    .prognosa-table tbody tr:last-child td {
      border-bottom: none;
    }

    .proyek-name {
      min-width: 180px;
      color: #111827;
      font-weight: 700;
    }

    .nilai {
      font-weight: 600;
      white-space: nowrap;
    }


    /* BADGE */

    .badge {
      display: inline-flex;
      padding: 5px 9px;

      background: #eef2ff;
      color: #4338ca;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }


    /* EMPTY */

    .empty-state {
      padding: 50px 20px;

      text-align: center;

      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      color: #9ca3af;
    }


    @media (max-width: 900px) {

      .prognosa-page {
        margin-left: 0;
        width: 100%;
        padding: 20px;
      }

      .prognosa-summary {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <div id="sidebarContainer"></div>


  <main class="prognosa-page">


    <!-- HEADER -->

    <div class="prognosa-header">

      <h1>
        Prognosa
      </h1>

      <p>
        Proyeksi penerimaan berdasarkan jenis proyek,
        sub jenis proyek, kategori dan jadwal termin.
      </p>

    </div>


    <!-- SUMMARY -->

    <section class="prognosa-summary">

      <div class="summary-card">

        <span class="summary-label">
          Total Prognosa
        </span>

        <span
          class="summary-value"
          id="totalPrognosa"
        >
          Rp 0
        </span>

      </div>


      <div class="summary-card">

        <span class="summary-label">
          Jumlah Proyek
        </span>

        <span
          class="summary-value"
          id="jumlahProyek"
        >
          0
        </span>

      </div>


      <div class="summary-card">

        <span class="summary-label">
          Jumlah Termin
        </span>

        <span
          class="summary-value"
          id="jumlahTermin"
        >
          0
        </span>

      </div>

    </section>


    <!-- FILTER -->

    <section class="filter-card">

      <input
        type="text"
        id="searchPrognosa"
        placeholder="Cari proyek, klien atau kategori..."
      >


      <select id="filterTahun">

        <option value="">
          Semua Tahun
        </option>

      </select>


      <select id="filterJenis">

        <option value="">
          Semua Jenis Proyek
        </option>

      </select>


      <select id="filterStatusPengadaan">

        <option value="">
          Semua Status Pengadaan
        </option>

      </select>


      <select id="filterStatusTeknis">

        <option value="">
          Semua Status Teknis
        </option>

      </select>

    </section>


    <!-- GROUPING -->

    <div id="prognosaGroup">

      <div class="empty-state">
        Memuat data prognosa...
      </div>

    </div>


  </main>


  <script src="/layout.js"></script>

  <script src="/prognosa.js"></script>


</body>

</html>
