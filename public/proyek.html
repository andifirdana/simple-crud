<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Proyek - Proporto
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f5f7fb;

      color: #1f2937;

      overflow-x: hidden;
    }


    /* ==================================================
       MAIN PAGE
    ================================================== */

    .project-page {
      width: 100%;

      max-width: 1500px;

      margin: 0 auto;
    }


    /* ==================================================
       HEADER
    ================================================== */

    .page-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 6px;

      color: #0f172a;

      font-size: 27px;

      font-weight: 750;

      letter-spacing: -0.5px;
    }

    .page-header p {
      margin: 0;

      color: #64748b;

      font-size: 14px;
    }


    /* ==================================================
       BUTTON
    ================================================== */

    .btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      min-height: 36px;

      padding: 9px 14px;

      border: none;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 600;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .btn-primary {
      background: #4f46e5;

      color: #ffffff;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-secondary {
      background: #f8fafc;

      color: #475569;

      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #eef2ff;

      color: #4f46e5;

      border-color: #c7d2fe;
    }


    /* ==================================================
       USER INFO
    ================================================== */

    .user-info-bar {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 18px;

      color: #64748b;

      font-size: 13px;
    }

    .user-info-bar strong {
      color: #0f172a;
    }

    .role-badge {
      display: inline-flex;

      align-items: center;

      padding: 4px 8px;

      background: #eef2ff;

      color: #4338ca;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 650;
    }


    /* ==================================================
       FILTER
    ================================================== */

    .filter-card {
      display: grid;

      grid-template-columns:
        minmax(220px, 2fr)
        repeat(4, minmax(155px, 1fr));

      gap: 12px;

      padding: 16px;

      margin-bottom: 20px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 14px;
    }

    .filter-card input,
    .filter-card select {
      width: 100%;

      min-width: 0;

      height: 40px;

      padding: 9px 11px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      background: #ffffff;

      color: #334155;

      font-family: inherit;

      font-size: 13px;
    }

    .filter-card input:focus,
    .filter-card select:focus {
      outline: none;

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.08);
    }


    /* ==================================================
       TABLE
    ================================================== */

    .table-card {
      width: 100%;

      max-width: 100%;

      min-width: 0;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 14px;

      overflow: hidden;
    }

    .table-wrapper {
      width: 100%;

      max-width: 100%;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;
    }

    .table-wrapper::-webkit-scrollbar {
      height: 7px;
    }

    .table-wrapper::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;

      border-radius: 999px;
    }

    table {
      width: 100%;

      min-width: 1780px;

      border-collapse: collapse;
    }

    thead {
      background: #f8fafc;
    }

    th {
      padding: 13px 14px;

      color: #64748b;

      font-size: 11px;

      font-weight: 700;

      text-align: left;

      text-transform: uppercase;

      letter-spacing: 0.04em;

      white-space: nowrap;
    }

    td {
      padding: 14px;

      border-top: 1px solid #f1f5f9;

      color: #334155;

      font-size: 13px;

      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbff;
    }


    /* ==================================================
       PROJECT
    ================================================== */

    .project-name {
      max-width: 260px;

      color: #111827;

      font-weight: 700;

      line-height: 1.4;
    }

    .project-id {
      color: #94a3b8;

      font-size: 11px;
    }

    .sub-text {
      margin-top: 4px;

      color: #64748b;

      font-size: 11px;
    }

    .money {
      font-weight: 650;

      white-space: nowrap;
    }


    /* ==================================================
       STATUS
    ================================================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 650;

      white-space: nowrap;
    }

    .badge-aktif {
      background: #ecfdf5;

      color: #047857;
    }

    .badge-done {
      background: #eff6ff;

      color: #1d4ed8;
    }

    .badge-cancel {
      background: #fef2f2;

      color: #b91c1c;
    }


    /* ==================================================
       ACTION
    ================================================== */

    .action-buttons {
      display: flex;

      align-items: center;

      gap: 6px;
    }


    /* ==================================================
       EMPTY
    ================================================== */

    .empty-state {
      padding: 50px !important;

      color: #64748b;

      text-align: center;
    }


    /* ==================================================
       RESPONSIVE
    ================================================== */

    @media (max-width: 1100px) {

      .filter-card {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .page-header {
        flex-direction: column;

        align-items: flex-start;
      }

      .filter-card {
        grid-template-columns: 1fr;
      }

    }

/* =====================================================
   TABLE ACTIONS
===================================================== */

.table-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

.btn-detail,
.btn-delete-project {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: 0.2s;
}

.btn-detail {
  color: #334155;
  background: #ffffff;
  border: 1px solid #dbe2ea;
}

.btn-detail:hover {
  color: #4338ca;
  background: #eef2ff;
  border-color: #a5b4fc;
}

.btn-delete-project {
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
}

.btn-delete-project:hover:not(:disabled) {
  color: #ffffff;
  background: #dc2626;
  border-color: #dc2626;
}

.btn-delete-project:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* =========================================
   NAMA DAN KATEGORI PROYEK
========================================= */

.proyek-info-cell {
  width: 320px;
  min-width: 260px;
  max-width: 380px;
}

.proyek-main-name {
  color: #0f172a;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.proyek-category-name {
  display: inline-flex;
  align-items: center;
  margin-top: 6px;
  padding: 4px 8px;
  color: #4f46e5;
  background: #eef2ff;
  border: 1px solid #c7d2fe;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.jenis-proyek-main {
  color: #334155;
  font-weight: 650;
}

.jenis-proyek-sub {
  margin-top: 3px;
  color: #64748b;
  font-size: 11.5px;
}

.proyek-info-cell {
  min-width: 230px;
  max-width: 320px;
  vertical-align: middle;
}

.proyek-main-name {
  color: #111827;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.proyek-category-name {
  display: block;
  margin-top: 4px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  color: #64748b;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.btn-project-log {
  min-height: 34px;
  padding: 7px 13px;
  border: 1px solid #c7d2fe;
  border-radius: 9px;
  background: #eef2ff;
  color: #4338ca;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.btn-project-log:hover {
  border-color: #818cf8;
  background: #e0e7ff;
  transform: translateY(-1px);
}

.activity-modal {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.activity-modal.is-open {
  display: flex;
}

.activity-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.58);
  backdrop-filter: blur(4px);
}

.activity-modal-dialog {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: min(900px, 100%);
  max-height: min(760px, 90vh);
  overflow: hidden;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  background: #ffffff;
  box-shadow:
    0 30px 70px rgba(15, 23, 42, 0.3);
}

.activity-modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 26px 20px;
  border-bottom: 1px solid #e2e8f0;
}

.activity-modal-eyebrow {
  display: block;
  margin-bottom: 5px;
  color: #6366f1;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.activity-modal-header h2 {
  margin: 0;
  color: #0f172a;
  font-size: 21px;
  line-height: 1.3;
}

.activity-modal-header p {
  margin: 5px 0 0;
  color: #64748b;
  font-size: 13px;
}

.activity-modal-close {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border: 0;
  border-radius: 10px;
  background: #f1f5f9;
  color: #475569;
  font-size: 27px;
  line-height: 1;
  cursor: pointer;
}

.activity-modal-close:hover {
  background: #fee2e2;
  color: #dc2626;
}

.activity-modal-body {
  min-height: 220px;
  overflow-y: auto;
  padding: 22px 26px;
  background: #f8fafc;
}

.activity-log-list {
  position: relative;
}

.activity-log-list::before {
  position: absolute;
  top: 14px;
  bottom: 14px;
  left: 15px;
  width: 2px;
  background: #dbeafe;
  content: "";
}

.activity-log-item {
  position: relative;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: 14px;
  padding-bottom: 18px;
}

.activity-log-item:last-child {
  padding-bottom: 0;
}

.activity-log-dot {
  position: relative;
  z-index: 1;
  width: 32px;
  height: 32px;
  border: 5px solid #f8fafc;
  border-radius: 50%;
  background: #4f46e5;
  box-shadow: 0 0 0 1px #c7d2fe;
}

.activity-log-card {
  padding: 16px 18px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  background: #ffffff;
}

.activity-log-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.activity-log-description {
  margin: 0;
  color: #1e293b;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.55;
}

.activity-log-date {
  flex: 0 0 auto;
  color: #64748b;
  font-size: 11px;
  white-space: nowrap;
}

.activity-log-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.activity-log-chip {
  padding: 4px 8px;
  border-radius: 999px;
  background: #eef2ff;
  color: #4338ca;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.activity-log-user {
  margin-top: 10px;
  color: #64748b;
  font-size: 12px;
}

.activity-log-change {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    24px
    minmax(0, 1fr);
  gap: 8px;
  margin-top: 13px;
}

.activity-log-value {
  padding: 9px 11px;
  border-radius: 9px;
  background: #f1f5f9;
  color: #475569;
  font-size: 12px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.activity-log-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  font-weight: 800;
}

.activity-log-loading,
.activity-log-empty {
  padding: 54px 20px;
  color: #64748b;
  text-align: center;
  font-size: 14px;
}

.activity-modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 26px;
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
  color: #64748b;
  font-size: 12px;
}

.activity-modal-close-button {
  padding: 9px 18px;
  border: 0;
  border-radius: 9px;
  background: #0f172a;
  color: #ffffff;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
}

body.activity-modal-open {
  overflow: hidden;
}

@media (max-width: 640px) {
  .activity-modal {
    padding: 12px;
  }

  .activity-modal-dialog {
    max-height: 92vh;
    border-radius: 16px;
  }

  .activity-modal-header,
  .activity-modal-body,
  .activity-modal-footer {
    padding-left: 17px;
    padding-right: 17px;
  }

  .activity-log-top {
    display: block;
  }

  .activity-log-date {
    display: block;
    margin-top: 6px;
  }

  .activity-log-change {
    grid-template-columns: 1fr;
  }

  .activity-log-arrow {
    transform: rotate(90deg);
  }
}
/* Semua filter proyek dalam satu baris */
.project-page .filter-card {
  display: grid !important;

  grid-template-columns:
    minmax(180px, 1.5fr)
    repeat(6, minmax(140px, 1fr)) !important;

  grid-auto-flow: row;

  align-items: center;

  gap: 12px;

  overflow-x: auto;
}

.project-page .filter-card > input,
.project-page .filter-card > select {
  width: 100% !important;

  min-width: 0 !important;

  max-width: none !important;

  grid-column: auto !important;

  grid-row: auto !important;

  box-sizing: border-box;
}

  </style>

</head>


<body>


  <div class="app-layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <div id="sidebarContainer"></div>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


      <div class="project-page">


        <!-- =============================================
             HEADER
        ============================================== -->

        <div class="page-header">


          <div>

            <h1>
              Daftar Proyek
            </h1>

          </div>


          <a
            href="/proyek-form.html"
            class="btn btn-primary"
          >
            + Tambah Proyek
          </a>


        </div>

        <!-- =============================================
             FILTER
        ============================================== -->

        <div class="filter-card">


          <input
            type="text"
            id="searchInput"
            placeholder="Cari Proyek"
          >


          <select id="kategoriFilter">

            <option value="">
              Semua Kategori
            </option>

          </select>


          <select id="jenisFilter">

            <option value="">
              Semua Jenis Proyek
            </option>

          </select>


          <select id="klienFilter">

            <option value="">
              Semua Klien
            </option>

          </select>


          <select id="partnerFilter">

            <option value="">
              Semua Partner
            </option>

          </select>

        <select id="statusFilter">
          <option value="">
            Semua Status
          </option>
        </select>

        <select id="picFilter">
          <option value="">
            Semua PIC
          </option>
        </select>
        </div>


        <!-- =============================================
             TABLE
        ============================================== -->

        <div class="table-card">


          <div class="table-wrapper">


            <table>


              <thead>


                <tr>


                  <th>
                    Nama Proyek
                  </th>

                  <th>
                    Jenis Proyek
                  </th>

                  <th>
                    PIC
                  </th>

                  <th>
                    Klien
                  </th>


                  <th>
                      Partner
                  </th>


                  <th>
                    Nilai Klien
                  </th>


                  <th>
                    Nilai Partner
                  </th>


                  <th>
                    Margin
                  </th>


                  <th>
                    Margin %
                  </th>


                  <th>
                    Selesai Kontrak
                  </th>


                  <th>
                    Status
                  </th>


                  <th>
                    Aksi
                  </th>


                </tr>


              </thead>


              <tbody id="proyekTable">


                <tr>

                  <td
                    colspan="11"
                    class="empty-state"
                  >
                    Memuat proyek...
                  </td>

                </tr>


              </tbody>


            </table>


          </div>


        </div>

<div
  class="activity-modal"
  id="activityLogModal"
  aria-hidden="true"
>
  <div
    class="activity-modal-backdrop"
    data-close-activity-log
  ></div>

  <section
    class="activity-modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="activityLogTitle"
  >
    <header class="activity-modal-header">
      <div>
        <span class="activity-modal-eyebrow">
          Riwayat Aktivitas
        </span>

        <h2 id="activityLogTitle">
          Activity Log Proyek
        </h2>

        <p id="activityLogProjectName">
          -
        </p>
      </div>

      <button
        type="button"
        class="activity-modal-close"
        data-close-activity-log
        aria-label="Tutup"
      >
        &times;
      </button>
    </header>

    <div class="activity-modal-body">
      <div
        class="activity-log-loading"
        id="activityLogLoading"
      >
        Memuat activity log...
      </div>

      <div
        class="activity-log-empty"
        id="activityLogEmpty"
        hidden
      >
        Belum ada activity log untuk proyek ini.
      </div>

      <div
        class="activity-log-list"
        id="activityLogList"
      ></div>
    </div>

    <footer class="activity-modal-footer">
      <span id="activityLogTotal">
        0 aktivitas
      </span>

      <button
        type="button"
        class="activity-modal-close-button"
        data-close-activity-log
      >
        Tutup
      </button>
    </footer>
  </section>
</div>
        <!-- =============================================
             PAGINATION
        ============================================== -->

        <div
          id="pagination"
          class="pagination"
        ></div>


      </div>


    </main>


  </div>


  <!-- =================================================
       SCRIPT
  ================================================== -->
  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/proyek.js"></script>
  <script src="/pagination.js"></script>


</body>

</html>
