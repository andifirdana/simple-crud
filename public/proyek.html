<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Proyek - Proporto
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f5f7fb;

      color: #1f2937;

      overflow-x: hidden;
    }


    /* ==================================================
       MAIN PAGE
    ================================================== */

    .project-page {
      width: 100%;

      max-width: 1500px;

      margin: 0 auto;
    }


    /* ==================================================
       HEADER
    ================================================== */

    .page-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 6px;

      color: #0f172a;

      font-size: 27px;

      font-weight: 750;

      letter-spacing: -0.5px;
    }

    .page-header p {
      margin: 0;

      color: #64748b;

      font-size: 14px;
    }


    /* ==================================================
       BUTTON
    ================================================== */

    .btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      min-height: 36px;

      padding: 9px 14px;

      border: none;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 600;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .btn-primary {
      background: #4f46e5;

      color: #ffffff;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-secondary {
      background: #f8fafc;

      color: #475569;

      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background: #eef2ff;

      color: #4f46e5;

      border-color: #c7d2fe;
    }


    /* ==================================================
       USER INFO
    ================================================== */

    .user-info-bar {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 18px;

      color: #64748b;

      font-size: 13px;
    }

    .user-info-bar strong {
      color: #0f172a;
    }

    .role-badge {
      display: inline-flex;

      align-items: center;

      padding: 4px 8px;

      background: #eef2ff;

      color: #4338ca;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 650;
    }


    /* ==================================================
       FILTER
    ================================================== */

    .filter-card {
      display: grid;

      grid-template-columns:
        minmax(220px, 2fr)
        repeat(4, minmax(155px, 1fr));

      gap: 12px;

      padding: 16px;

      margin-bottom: 20px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 14px;
    }

    .filter-card input,
    .filter-card select {
      width: 100%;

      min-width: 0;

      height: 40px;

      padding: 9px 11px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      background: #ffffff;

      color: #334155;

      font-family: inherit;

      font-size: 13px;
    }

    .filter-card input:focus,
    .filter-card select:focus {
      outline: none;

      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.08);
    }


    /* ==================================================
       TABLE
    ================================================== */

    .table-card {
      width: 100%;

      max-width: 100%;

      min-width: 0;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 14px;

      overflow: hidden;
    }

    .table-wrapper {
      width: 100%;

      max-width: 100%;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;
    }

    .table-wrapper::-webkit-scrollbar {
      height: 7px;
    }

    .table-wrapper::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;

      border-radius: 999px;
    }

    table {
      width: 100%;

      min-width: 1780px;

      border-collapse: collapse;
    }

    thead {
      background: #f8fafc;
    }

    th {
      padding: 13px 14px;

      color: #64748b;

      font-size: 11px;

      font-weight: 700;

      text-align: left;

      text-transform: uppercase;

      letter-spacing: 0.04em;

      white-space: nowrap;
    }

    td {
      padding: 14px;

      border-top: 1px solid #f1f5f9;

      color: #334155;

      font-size: 13px;

      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbff;
    }


    /* ==================================================
       PROJECT
    ================================================== */

    .project-name {
      max-width: 260px;

      color: #111827;

      font-weight: 700;

      line-height: 1.4;
    }

    .project-id {
      color: #94a3b8;

      font-size: 11px;
    }

    .sub-text {
      margin-top: 4px;

      color: #64748b;

      font-size: 11px;
    }

    .money {
      font-weight: 650;

      white-space: nowrap;
    }


    /* ==================================================
       STATUS
    ================================================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 650;

      white-space: nowrap;
    }

    .badge-aktif {
      background: #ecfdf5;

      color: #047857;
    }

    .badge-done {
      background: #eff6ff;

      color: #1d4ed8;
    }

    .badge-cancel {
      background: #fef2f2;

      color: #b91c1c;
    }


    /* ==================================================
       ACTION
    ================================================== */

    .action-buttons {
      display: flex;

      align-items: center;

      gap: 6px;
    }


    /* ==================================================
       EMPTY
    ================================================== */

    .empty-state {
      padding: 50px !important;

      color: #64748b;

      text-align: center;
    }


    /* ==================================================
       RESPONSIVE
    ================================================== */

    @media (max-width: 1100px) {

      .filter-card {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .page-header {
        flex-direction: column;

        align-items: flex-start;
      }

      .filter-card {
        grid-template-columns: 1fr;
      }

    }

/* =====================================================
   TABLE ACTIONS
===================================================== */

.table-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

.btn-detail,
.btn-delete-project {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: 0.2s;
}

.btn-detail {
  color: #334155;
  background: #ffffff;
  border: 1px solid #dbe2ea;
}

.btn-detail:hover {
  color: #4338ca;
  background: #eef2ff;
  border-color: #a5b4fc;
}

.btn-delete-project {
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
}

.btn-delete-project:hover:not(:disabled) {
  color: #ffffff;
  background: #dc2626;
  border-color: #dc2626;
}

.btn-delete-project:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
  </style>

</head>


<body>


  <div class="app-layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <div id="sidebarContainer"></div>


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


      <div class="project-page">


        <!-- =============================================
             HEADER
        ============================================== -->

        <div class="page-header">


          <div>

            <h1>
              Daftar Proyek
            </h1>

          </div>


          <a
            href="/proyek-form.html"
            class="btn btn-primary"
          >
            + Tambah Proyek
          </a>


        </div>

        <!-- =============================================
             FILTER
        ============================================== -->

        <div class="filter-card">


          <input
            type="text"
            id="searchInput"
            placeholder="Cari Proyek"
          >


          <select id="kategoriFilter">

            <option value="">
              Semua Kategori
            </option>

          </select>


          <select id="jenisFilter">

            <option value="">
              Semua Jenis Proyek
            </option>

          </select>


          <select id="klienFilter">

            <option value="">
              Semua Klien
            </option>

          </select>


          <select id="partnerFilter">

            <option value="">
              Semua Partner
            </option>

          </select>


        </div>


        <!-- =============================================
             TABLE
        ============================================== -->

        <div class="table-card">


          <div class="table-wrapper">


            <table>


              <thead>


                <tr>


                  <th>
                    Nama Proyek
                  </th>


                  <th>
                    Kategori
                  </th>


                  <th>
                    Jenis
                  </th>


                  <th>
                    Klien
                  </th>


                  <th>
                    Nilai Proyek
                  </th>


                  <th>
                    End Date
                  </th>


                  <th>
                    Partner
                  </th>


                  <th>
                    Nilai Partner
                  </th>


                  <th>
                    Margin Nominal
                  </th>


                  <th>
                    Margin Persen
                  </th>


                  <th>
                    Status
                  </th>


                  <th>
                    Aksi
                  </th>


                </tr>


              </thead>


              <tbody id="proyekTable">


                <tr>

                  <td
                    colspan="12"
                    class="empty-state"
                  >
                    Memuat proyek...
                  </td>

                </tr>


              </tbody>


            </table>


          </div>


        </div>


        <!-- =============================================
             PAGINATION
        ============================================== -->

        <div
          id="pagination"
          class="pagination"
        ></div>


      </div>


    </main>


  </div>


  <!-- =================================================
       SCRIPT
  ================================================== -->
  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/proyek.js"></script>
  <script src="/pagination.js"></script>


</body>

</html>
