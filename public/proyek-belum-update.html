<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Proyek Belum Update - Portopro
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      overflow-x: hidden;
    }

    .main-content {
      width: calc(100% - 260px);
      min-height: 100vh;
      margin-left: 260px;
      padding: 32px;
    }

    .page-container {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .page-header h1 {
      margin: 0 0 7px;
      color: #0f172a;
      font-size: 28px;
      letter-spacing: -0.6px;
    }

    .page-header p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .period-card {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 280px;
      padding: 15px 17px;
      background: linear-gradient(
        135deg,
        #fff7ed,
        #fffbeb
      );
      border: 1px solid #fed7aa;
      border-radius: 14px;
    }

    .period-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 41px;
      height: 41px;
      flex: 0 0 41px;
      background: #ffffff;
      border-radius: 11px;
      color: #c2410c;
      font-size: 19px;
    }

    .period-label {
      margin-bottom: 4px;
      color: #9a3412;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .period-value {
      color: #7c2d12;
      font-size: 13px;
      font-weight: 750;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search-input {
      width: min(430px, 100%);
      min-height: 43px;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      color: #334155;
      font: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: #6366f1;
      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.09);
    }

    .summary-card {
      margin-bottom: 18px;
      padding: 17px 19px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
    }

    .summary-label {
      margin-bottom: 5px;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .summary-value {
      color: #dc2626;
      font-size: 25px;
      font-weight: 800;
    }

    .table-card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      box-shadow:
        0 2px 5px
        rgba(15, 23, 42, 0.03);
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-collapse: collapse;
    }

    th {
      padding: 13px 15px;
      background: #f8fafc;
      color: #64748b;
      font-size: 10px;
      font-weight: 750;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 15px;
      border-top: 1px solid #eef2f7;
      color: #334155;
      font-size: 13px;
      vertical-align: middle;
    }

    .project-name {
      color: #0f172a;
      font-weight: 750;
    }

    .project-link {
      color: #4f46e5;
      text-decoration: none;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-active {
      color: #166534;
      background: #dcfce7;
    }

    .badge-done {
      color: #3730a3;
      background: #e0e7ff;
    }

    .badge-cancel {
      color: #991b1b;
      background: #fee2e2;
    }

    .late-duration {
      color: #b91c1c;
      font-weight: 750;
      white-space: nowrap;
    }

    .empty-state {
      padding: 55px 25px;
      color: #64748b;
      text-align: center;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 20px;
      padding: 15px 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
    }

    .pagination-info {
      color: #64748b;
      font-size: 12px;
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-button {
      min-width: 37px;
      height: 37px;
      padding: 0 11px;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      color: #334155;
      font-weight: 650;
      cursor: pointer;
    }

    .page-button.active {
      color: #ffffff;
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .page-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .main-content {
        width: 100%;
        margin-left: 0;
        padding: 20px;
      }

      .page-header {
        flex-direction: column;
      }

      .period-card {
        width: 100%;
      }

      .pagination {
        align-items: stretch;
        flex-direction: column;
      }

      .pagination-buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="app-layout">

    <div id="sidebarContainer"></div>

    <main class="main-content">

      <div class="page-container">

        <div class="page-header">

          <div>
            <h1>
              Proyek Belum Update
            </h1>

            <p>
              Proyek yang belum diperbarui pada minggu berjalan.
            </p>
          </div>

          <div class="period-card">

            <div class="period-icon">
              ◷
            </div>

            <div>
              <div class="period-label">
                Periode Berjalan
              </div>

              <div
                class="period-value"
                id="periodeBerjalan"
              >
                -
              </div>
            </div>

          </div>

        </div>


        <div class="toolbar">

          <input
            type="search"
            class="search-input"
            id="searchProyek"
            placeholder="Cari proyek, kategori, jenis, PIC..."
          >

        </div>


        <div class="summary-card">

          <div class="summary-label">
            Total Proyek Belum Update
          </div>

          <div
            class="summary-value"
            id="totalProyek"
          >
            0
          </div>

        </div>


        <div class="table-card">

          <div class="table-wrapper">

            <table>

              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Proyek</th>
                  <th>Kategori</th>
                  <th>Jenis Proyek</th>
                  <th>PIC</th>
                  <th>Status</th>
                  <th>Terakhir Update</th>
                  <th>Belum Update</th>
                  <th>Aksi</th>
                </tr>
              </thead>

              <tbody id="proyekTable">

                <tr>
                  <td
                    colspan="9"
                    class="empty-state"
                  >
                    Memuat data proyek...
                  </td>
                </tr>

              </tbody>

            </table>

          </div>

        </div>


        <div
          class="pagination"
          id="pagination"
          style="display:none;"
        >

          <div
            class="pagination-info"
            id="paginationInfo"
          >
            -
          </div>

          <div
            class="pagination-buttons"
            id="paginationButtons"
          ></div>

        </div>

      </div>

    </main>

  </div>

  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/proyek-belum-update.js"></script>

</body>

</html>
