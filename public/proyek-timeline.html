<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Timeline Proyek - Portopro
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      background:
        #f5f7fb;

      color:
        #172033;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    /* ========================================
       PAGE
    ======================================== */

    .timeline-page {
      margin-left: 260px;

      width:
        calc(100% - 260px);

      min-height: 100vh;

      padding: 28px;
    }


    .timeline-shell {
      max-width: 1800px;

      margin:
        0 auto;
    }


    /* ========================================
       HEADER
    ======================================== */

    .timeline-header {
      display: flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap: 20px;

      margin-bottom:
        22px;
    }


    .timeline-eyebrow {
      margin:
        0 0 6px;

      color:
        #4f46e5;

      font-size:
        10px;

      font-weight:
        800;

      letter-spacing:
        1.4px;
    }


    .timeline-header h1 {
      margin:
        0 0 7px;

      font-size:
        27px;
    }


    .timeline-header p {
      margin: 0;

      color:
        #64748b;

      font-size:
        13px;
    }


    .timeline-header-actions {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;
    }


    /* ========================================
       BUTTON
    ======================================== */

    .timeline-button {
      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        38px;

      padding:
        9px 14px;

      border:
        1px solid transparent;

      border-radius:
        9px;

      font-family:
        inherit;

      font-size:
        12px;

      font-weight:
        700;

      cursor:
        pointer;

      text-decoration:
        none;

      white-space:
        nowrap;
    }


    .timeline-button.primary {
      color:
        #ffffff;

      background:
        #4f46e5;
    }


    .timeline-button.secondary {
      color:
        #4338ca;

      background:
        #eef2ff;

      border-color:
        #e0e7ff;
    }


    .timeline-button.filter-active {
      color:
        #ffffff;

      background:
        #4338ca;

      border-color:
        #4338ca;
    }


    /* ========================================
       PROJECT INFO
    ======================================== */

    .timeline-project {
      margin-bottom:
        18px;

      padding:
        20px;

      border:
        1px solid #e2e8f0;

      border-radius:
        14px;

      background:
        #ffffff;
    }


    .timeline-project span {
      display:
        block;

      margin-bottom:
        6px;

      color:
        #64748b;

      font-size:
        11px;

      font-weight:
        700;

      text-transform:
        uppercase;

      letter-spacing:
        0.6px;
    }


    .timeline-project h2 {
      margin:
        0 0 6px;

      font-size:
        21px;
    }


    .timeline-project p {
      margin: 0;

      color:
        #64748b;

      font-size:
        13px;
    }


    /* ========================================
       CARD
    ======================================== */

    .timeline-card {
      overflow:
        hidden;

      border:
        1px solid #e2e8f0;

      border-radius:
        14px;

      background:
        #ffffff;

      box-shadow:
        0 6px 24px
        rgba(
          15,
          23,
          42,
          0.03
        );
    }


    /* ========================================
       TOOLBAR
    ======================================== */

    .timeline-toolbar {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 18px;

      padding:
        18px 20px;

      border-bottom:
        1px solid #e2e8f0;
    }


    .timeline-toolbar h3 {
      margin:
        0 0 4px;

      font-size:
        17px;
    }


    .timeline-toolbar p {
      margin: 0;

      color:
        #64748b;

      font-size:
        12px;
    }


    .timeline-filter {
      display:
        flex;

      gap: 7px;

      flex-wrap: wrap;
    }


    /* ========================================
       LEGEND
    ======================================== */

    .timeline-legend {
      display:
        flex;

      gap: 20px;

      flex-wrap: wrap;

      padding:
        12px 20px;

      border-bottom:
        1px solid #e2e8f0;

      background:
        #f8fafc;

      font-size:
        12px;
    }


    .legend-item {
      display:
        flex;

      align-items:
        center;

      gap: 7px;
    }


    .legend-line {
      width:
        28px;

      height:
        6px;

      border-radius:
        999px;
    }


    .legend-line.target {
      background:
        #2563eb;
    }


    .legend-line.actual {
      background:
        #16a34a;
    }


    /* ========================================
       MESSAGE
    ======================================== */

    .timeline-message {
      margin:
        18px 20px;

      padding:
        12px 14px;

      border:
        1px solid #c7d2fe;

      border-radius:
        9px;

      color:
        #3730a3;

      background:
        #eef2ff;

      font-size:
        13px;
    }


    .timeline-message.error {
      color:
        #991b1b;

      border-color:
        #fecaca;

      background:
        #fef2f2;
    }


    /* ========================================
       GANTT
    ======================================== */

    .gantt-scroll {
      width:
        100%;

      overflow-x:
        auto;

      padding-bottom:
        8px;
    }


    .gantt-table {
      width:
        max-content;

      min-width:
        100%;

      border-collapse:
        separate;

      border-spacing:
        0;

      font-size:
        12px;
    }


    .gantt-table th,
    .gantt-table td {
      height:
        54px;

      border-right:
        1px solid #e5e7eb;

      border-bottom:
        1px solid #e5e7eb;
    }


    .gantt-name {
      position:
        sticky;

      left: 0;

      z-index: 3;

      min-width:
        300px;

      max-width:
        300px;

      padding:
        8px 12px;

      background:
        #ffffff;

      text-align:
        left;
    }


    .gantt-table thead
    .gantt-name {
      z-index: 6;

      background:
        #dbeafe;

      text-align:
        center;
    }


    .gantt-month {
      height:
        34px !important;

      padding:
        6px;

      background:
        #dbeafe;

      text-align:
        center;

      font-weight:
        800;
    }


    .gantt-week {
      width:
        44px;

      min-width:
        44px;

      height:
        34px !important;

      background:
        #eff6ff;

      text-align:
        center;
    }


    .gantt-module td {
      height:
        36px;

      background:
        #f3f4f6;

      font-weight:
        800;
    }


    .gantt-module
    .gantt-name {
      background:
        #f3f4f6;
    }


    /* ========================================
       CELL GANTT

       Target = atas
       Actual = bawah
    ======================================== */

    .gantt-cell {
      position:
        relative;

      width:
        44px;

      min-width:
        44px;

      height:
        54px;

      padding: 0;

      background:
        #ffffff;
    }


    .gantt-track {
      position:
        absolute;

      left: 0;

      width:
        100%;

      height:
        8px;

      border-radius:
        0;
    }


    /*
     * TARGET SELALU DI ATAS
     */
    .gantt-track.target {
      top:
        13px;

      background:
        #2563eb;
    }


    /*
     * ACTUAL SELALU DI BAWAH
     */
    .gantt-track.actual {
      bottom:
        13px;

      background:
        #16a34a;
    }


    /*
     * membuat ujung garis lebih rapi
     */
    .gantt-track.start {
      border-radius:
        999px 0 0 999px;
    }


    .gantt-track.end {
      border-radius:
        0 999px 999px 0;
    }


    .gantt-track.start.end {
      border-radius:
        999px;
    }


    .gantt-empty {
      padding:
        35px;

      color:
        #64748b;

      text-align:
        center;
    }


    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (
      max-width: 900px
    ) {

      .timeline-page {
        width:
          100%;

        margin-left:
          0;

        padding:
          18px;
      }


      .timeline-header,
      .timeline-toolbar {
        align-items:
          flex-start;

        flex-direction:
          column;
      }

    }

  </style>

</head>


<body>

  <div id="sidebarContainer"></div>


  <main class="timeline-page">

    <div class="timeline-shell">


      <!-- HEADER -->

      <header class="timeline-header">

        <div>

          <p class="timeline-eyebrow">
            PORTOPRO / TIMELINE
          </p>

          <h1>
            Timeline Proyek
          </h1>

          <p>
            Perbandingan jadwal Target
            dan realisasi Aktual.
          </p>

        </div>


        <div class="timeline-header-actions">

          <a
            id="backToProgress"
            class="
              timeline-button
              primary
            "
            href="#"
          >
            Update Progress
          </a>


          <a
            id="backToProject"
            class="
              timeline-button
              secondary
            "
            href="/proyek.html"
          >
            Kembali ke Proyek
          </a>

        </div>

      </header>


      <!-- INFORMASI PROYEK -->

      <section class="timeline-project">

        <span>
          Proyek
        </span>

        <h2 id="timelineNamaProyek">
          Memuat proyek...
        </h2>

        <p id="timelineInstansi">
          -
        </p>

      </section>


      <!-- GANTT -->

      <section class="timeline-card">


        <div class="timeline-toolbar">

          <div>

            <h3>
              Gantt Chart
            </h3>

            <p>
              Target ditampilkan di atas,
              Aktual di bawah.
            </p>

          </div>


          <div class="timeline-filter">

            <button
              type="button"
              id="filterActual"
              class="
                timeline-button
                secondary
              "
            >
              Actual
            </button>


            <button
              type="button"
              id="filterTarget"
              class="
                timeline-button
                secondary
              "
            >
              Target
            </button>


            <button
              type="button"
              id="filterReset"
              class="
                timeline-button
                primary
              "
            >
              Reset
            </button>

          </div>

        </div>


        <div class="timeline-legend">

          <div class="legend-item">

            <span
              class="
                legend-line
                target
              "
            ></span>

            Target

          </div>


          <div class="legend-item">

            <span
              class="
                legend-line
                actual
              "
            ></span>

            Actual

          </div>

        </div>


        <div
          id="timelineMessage"
          class="timeline-message"
        >
          Memuat timeline...
        </div>


        <div class="gantt-scroll">

          <table
            class="gantt-table"
            id="ganttTable"
          >

            <thead
              id="ganttHead"
            ></thead>

            <tbody
              id="ganttBody"
            >

              <tr>

                <td class="gantt-empty">
                  Memuat timeline...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </section>

    </div>

  </main>


  <script src="/layout.js"></script>

  <script src="/sidebar.js"></script>

  <script src="/proyek-timeline.js"></script>

</body>

</html>
