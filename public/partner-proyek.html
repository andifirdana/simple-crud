<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Partner - Portopro</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      overflow-x: hidden;
    }

    .main-content {
      width: calc(100% - 260px);
      min-height: 100vh;
      margin-left: 260px;
      padding: 32px;
      box-sizing: border-box;
    }

    .partner-page {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0 0 7px;
      color: #0f172a;
      font-size: 29px;
      letter-spacing: -0.7px;
    }

    .page-header p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .partner-toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .partner-search {
      width: min(420px, 100%);
      min-height: 44px;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 11px;
      box-sizing: border-box;
      font: inherit;
    }

    .partner-list {
      display: grid;
      gap: 18px;
    }

    .partner-card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 17px;
      box-shadow:
        0 2px 5px rgba(15, 23, 42, 0.04),
        0 10px 25px rgba(15, 23, 42, 0.04);
    }

    .partner-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
      border-bottom: 1px solid #eef2f7;
    }

    .partner-name {
      color: #0f172a;
      font-size: 19px;
      font-weight: 800;
    }

    .partner-code {
      margin-top: 4px;
      color: #64748b;
      font-size: 12px;
    }

    .project-total-badge {
      display: inline-flex;
      padding: 7px 12px;
      color: #4338ca;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .partner-summary {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 20px 24px;
    }

    .summary-item {
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 12px;
    }

    .summary-label {
      margin-bottom: 7px;
      color: #64748b;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.45px;
      text-transform: uppercase;
    }

    .summary-value {
      color: #0f172a;
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .summary-item.paid {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .summary-item.paid .summary-value {
      color: #166534;
    }

    .summary-item.remaining {
      background: #fff7ed;
      border-color: #fed7aa;
    }

    .summary-item.remaining .summary-value {
      color: #9a3412;
    }

    .project-section {
      padding: 0 24px 22px;
    }

    .project-section-title {
      margin: 2px 0 12px;
      color: #334155;
      font-size: 13px;
      font-weight: 750;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #eef2f7;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th {
      padding: 12px 14px;
      background: #f8fafc;
      color: #64748b;
      font-size: 10px;
      font-weight: 750;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 14px;
      border-top: 1px solid #eef2f7;
      color: #334155;
      font-size: 13px;
      vertical-align: middle;
    }

    .project-name {
      color: #0f172a;
      font-weight: 700;
    }

    .project-link {
      color: #4f46e5;
      text-decoration: none;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      padding: 50px 24px;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 15px;
      color: #64748b;
      text-align: center;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 22px;
      padding: 16px 18px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 13px;
    }

    .pagination-info {
      color: #64748b;
      font-size: 12px;
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-button {
      min-width: 38px;
      height: 38px;
      padding: 0 11px;
      background: #ffffff;
      border: 1px solid #dbe2ea;
      border-radius: 9px;
      color: #334155;
      font-weight: 650;
      cursor: pointer;
    }

    .page-button:hover:not(:disabled) {
      color: #4338ca;
      background: #eef2ff;
      border-color: #a5b4fc;
    }

    .page-button.active {
      color: #ffffff;
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .page-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    @media (max-width: 1000px) {
      .partner-summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .main-content {
        width: 100%;
        margin-left: 0;
        padding: 20px;
      }

      .page-header {
        flex-direction: column;
      }

      .partner-card-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 550px) {
      .partner-summary {
        grid-template-columns: 1fr;
      }

      .pagination {
        align-items: stretch;
        flex-direction: column;
      }

      .pagination-buttons {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="app-layout">

    <!-- SIDEBAR -->
    <div id="sidebarContainer"></div>

    <main class="main-content">

      <div class="partner-page">

        <div class="page-header">

          <div>
            <h1>Partner</h1>

            <p>
              Listing Partner dengan proyek aktif,
              nilai proyek, dan pembayaran.
            </p>
          </div>

        </div>

        <div class="partner-toolbar">

          <input
            type="search"
            class="partner-search"
            id="partnerSearch"
            placeholder="Cari nama Partner..."
          >

        </div>

        <div
          class="partner-list"
          id="partnerList"
        >
          <div class="empty-state">
            Memuat data Partner...
          </div>
        </div>

        <div
          class="pagination"
          id="partnerPagination"
          style="display:none;"
        >

          <div
            class="pagination-info"
            id="paginationInfo"
          >
            -
          </div>

          <div
            class="pagination-buttons"
            id="paginationButtons"
          ></div>

        </div>

      </div>

    </main>

  </div>

  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/partner-proyek.js"></script>

</body>

</html>
