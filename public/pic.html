<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Master PIC - Portopro</title>

  <!-- GLOBAL STYLE -->
  <link
    rel="stylesheet"
    href="/style.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f7fb;

      color: #1f2937;

      overflow-x: hidden;
    }



    /* =====================================================
       APP LAYOUT
    ===================================================== */

    .app-layout {
      min-height: 100vh;
    }


    .main-content {
      margin-left: 260px;

      width: calc(100% - 260px);

      min-width: 0;

      padding: 0;

      box-sizing: border-box;
    }


    .pic-page {
      width: 100%;

      max-width: 1500px;

      margin: 0 auto;

      padding: 32px;
    }



    /* =====================================================
       PAGE HEADER
    ===================================================== */

    .page-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 24px;
    }


    .page-header h1 {
      margin: 0 0 6px;

      color: #0f172a;

      font-size: 27px;

      font-weight: 750;

      letter-spacing: -0.5px;
    }


    .page-header p {
      margin: 0;

      color: #64748b;

      font-size: 14px;
    }



    /* =====================================================
       CARD
    ===================================================== */

    .pic-card {
      width: 100%;

      min-width: 0;

      margin-bottom: 24px;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.03);
    }



    /* =====================================================
       CARD HEADER
    ===================================================== */

    .card-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 16px;

      padding: 18px 20px;

      border-bottom: 1px solid #f1f5f9;
    }


    .card-header h2 {
      margin: 0 0 4px;

      color: #0f172a;

      font-size: 15px;

      font-weight: 700;
    }


    .card-header p {
      margin: 0;

      color: #64748b;

      font-size: 12px;
    }



    /* =====================================================
       FORM
    ===================================================== */

    .form-body {
      padding: 20px;
    }


    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }


    .form-group {
      min-width: 0;
    }


    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: #475569;

      font-size: 12px;

      font-weight: 650;
    }


    .form-group input,
    .form-group select {
      width: 100%;

      height: 40px;

      padding: 9px 11px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      background: #ffffff;

      color: #334155;

      font-family: inherit;

      font-size: 13px;

      outline: none;

      transition: 0.2s;
    }


    .form-group input::placeholder {
      color: #9ca3af;
    }


    .form-group input:focus,
    .form-group select:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.08);
    }



    /* =====================================================
       FORM ACTION
    ===================================================== */

    .form-actions {
      display: flex;

      justify-content: flex-end;

      align-items: center;

      gap: 8px;

      margin-top: 20px;

      padding-top: 18px;

      border-top: 1px solid #f1f5f9;
    }



    /* =====================================================
       BUTTON
    ===================================================== */

    .pic-btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 36px;

      padding: 9px 14px;

      border: none;

      border-radius: 8px;

      font-family: inherit;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;

      white-space: nowrap;

      transition: 0.2s;
    }


    .btn-primary {
      background: #4f46e5;

      color: #ffffff;
    }


    .btn-primary:hover {
      background: #4338ca;
    }


    .btn-secondary {
      background: #f3f4f6;

      color: #374151;
    }


    .btn-secondary:hover {
      background: #e5e7eb;
    }



    /* =====================================================
       TABLE TOOLBAR
    ===================================================== */

    .table-toolbar {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }


    .search-box {
      width: 280px;

      height: 36px;

      padding: 8px 11px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      background: #ffffff;

      color: #334155;

      font-family: inherit;

      font-size: 12px;

      outline: none;
    }


    .search-box:focus {
      border-color: #6366f1;

      box-shadow:
        0 0 0 3px
        rgba(99, 102, 241, 0.08);
    }



    /* =====================================================
       TABLE
    ===================================================== */

    .table-wrapper {
      width: 100%;

      max-width: 100%;

      overflow-x: auto;
    }


    .table-wrapper::-webkit-scrollbar {
      height: 7px;
    }


    .table-wrapper::-webkit-scrollbar-track {
      background: #f8fafc;
    }


    .table-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;

      border-radius: 999px;
    }


    table {
      width: 100%;

      min-width: 1150px;

      border-collapse: collapse;

      font-size: 13px;
    }


    thead {
      background: #f8fafc;
    }


    th {
      padding: 13px 14px;

      text-align: left;

      color: #64748b;

      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.04em;

      white-space: nowrap;
    }


    td {
      padding: 14px;

      border-top: 1px solid #f1f5f9;

      color: #334155;

      font-size: 13px;

      vertical-align: middle;

      white-space: nowrap;
    }


    tbody tr {
      transition: 0.15s;
    }


    tbody tr:hover {
      background: #fafbff;
    }



    /* =====================================================
       ACTION BUTTON DARI PIC.JS
    ===================================================== */

    td button {
      min-height: 30px;

      padding: 6px 10px;

      margin-right: 4px;

      border: none;

      border-radius: 6px;

      font-family: inherit;

      font-size: 11px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }


    .btn-edit {
      background: #eef2ff;

      color: #4338ca;
    }


    .btn-edit:hover {
      background: #e0e7ff;
    }


    .btn-delete {
      background: #fef2f2;

      color: #dc2626;
    }


    .btn-delete:hover {
      background: #fee2e2;
    }



    /* =====================================================
       EMPTY DATA
    ===================================================== */

    .empty-data {
      padding: 35px;

      text-align: center;

      color: #9ca3af;
    }



    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1100px) {

      .form-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 900px) {

      .card-header {
        flex-direction: column;

        align-items: flex-start;
      }


      .table-toolbar {
        width: 100%;
      }


      .search-box {
        width: 100%;
      }

    }


    @media (max-width: 768px) {

      .main-content {
        margin-left: 0;

        width: 100%;
      }


      .pic-page {
        padding: 20px;
      }

    }


    @media (max-width: 600px) {

      .form-grid {
        grid-template-columns: 1fr;
      }


      .page-header h1 {
        font-size: 23px;
      }

    }

  </style>

</head>



<body>


<div class="app-layout">


   <!-- =====================================================
       SIDEBAR
  ====================================================== -->

 <div id="sidebarContainer"></div>


  <!-- =====================================================
       MAIN CONTENT
  ====================================================== -->

  <main class="main-content">


    <div class="pic-page">



      <!-- =================================================
           PAGE HEADER
      ================================================== -->

      <div class="page-header">


        <div>

          <h1>
            Master PIC
          </h1>

          <p>
            Kelola PIC yang dapat ditugaskan pada kategori produk.
          </p>

        </div>


      </div>



      <!-- =================================================
           FORM PIC
      ================================================== -->

      <div class="pic-card">


        <div class="card-header">


          <div>

            <h2 id="formTitle">
              Tambah PIC
            </h2>

            <p>
              Tambahkan informasi PIC untuk kebutuhan proyek.
            </p>

          </div>


        </div>



        <div class="form-body">


          <form id="picForm">


            <div class="form-grid">



              <!-- NAMA -->

              <div class="form-group">

                <label for="nama">
                  Nama *
                </label>

                <input
                  id="nama"
                  type="text"
                  placeholder="Nama lengkap"
                  required
                >

              </div>



              <!-- NIK -->

              <div class="form-group">

                <label for="nik">
                  NIK *
                </label>

                <input
                  id="nik"
                  type="text"
                  placeholder="Masukkan NIK"
                  required
                >

              </div>



              <!-- INISIAL -->

              <div class="form-group">

                <label for="inisial">
                  Inisial
                </label>

                <input
                  id="inisial"
                  type="text"
                  placeholder="Contoh: NVA"
                >

              </div>



              <!-- JABATAN -->

              <div class="form-group">

                <label for="jabatan">
                  Jabatan *
                </label>

                <select
                  id="jabatan"
                  required
                >

                  <option value="">
                    Pilih Jabatan
                  </option>

                  <option value="Officer">
                    Officer
                  </option>

                  <option value="Staf">
                    Staf
                  </option>

                  <option value="Kabag">
                    Kabag
                  </option>

                  <option value="Staf Ahli">
                    Staf Ahli
                  </option>

                  <option value="Senior Specialist">
                    Senior Specialist
                  </option>

                  <option value="Kadiv">
                    Kadiv
                  </option>

                </select>

              </div>



              <!-- EMAIL -->

              <div class="form-group">

                <label for="email">
                  Email
                </label>

                <input
                  id="email"
                  type="email"
                  placeholder="nama@perusahaan.com"
                >

              </div>



              <!-- NO HP -->

              <div class="form-group">

                <label for="no_hp">
                  No. HP
                </label>

                <input
                  id="no_hp"
                  type="tel"
                  placeholder="081234567890"
                  inputmode="numeric"
                >

              </div>


            </div>



            <!-- FORM ACTION -->

            <div class="form-actions">


              <button
                type="submit"
                id="submitButton"
                class="
                  pic-btn
                  btn-primary
                "
              >
                + Simpan PIC
              </button>


              <button
                type="button"
                id="cancelButton"
                class="
                  pic-btn
                  btn-secondary
                "
                style="display:none;"
              >
                Batal
              </button>


            </div>


          </form>


        </div>


      </div>



      <!-- =================================================
           DAFTAR PIC
      ================================================== -->

      <div class="pic-card">


        <div class="card-header">


          <div>

            <h2>
              Daftar PIC
            </h2>

            <p>
              Data PIC yang tersedia untuk penugasan proyek.
            </p>

          </div>



          <div class="table-toolbar">


            <input
              id="searchInput"
              type="text"
              class="search-box"
              placeholder="Cari nama, NIK, jabatan..."
            >


          </div>


        </div>



        <!-- TABLE -->

        <div class="table-wrapper">


          <table>


            <thead>


              <tr>

                <th>
                  ID
                </th>

                <th>
                  Nama
                </th>

                <th>
                  NIK
                </th>

                <th>
                  Inisial
                </th>

                <th>
                  Jabatan
                </th>

                <th>
                  Email
                </th>

                <th>
                  No HP
                </th>

                <th>
                  Created At
                </th>

                <th>
                  Updated At
                </th>

                <th>
                  Aksi
                </th>

              </tr>


            </thead>



            <tbody id="picTable">


              <tr>

                <td
                  colspan="10"
                  style="
                    padding:40px;
                    text-align:center;
                    color:#64748b;
                  "
                >
                  Memuat data PIC...
                </td>

              </tr>


            </tbody>


          </table>


        </div>


      </div>


    </div>
    <!-- /pic-page -->


  </main>
  <!-- /main-content -->


</div>
<!-- /app-layout -->



<!-- =====================================================
     PIC JAVASCRIPT
====================================================== -->

<script src="/pic.js"></script>



<!-- =====================================================
     SIDEBAR USER + LOGOUT
====================================================== -->

<script>

  async function loadSidebarUser() {

    try {

      const response =
        await fetch(
          "/api/me"
        );


      if (!response.ok) {

        window.location.href =
          "/login.html";

        return;

      }


      const data =
        await response.json();


      const user =
        data.user || data;


      const userNama =
        document.getElementById(
          "userNama"
        );


      const userRole =
        document.getElementById(
          "userRole"
        );


      if (userNama) {

        userNama.textContent =
          user.nama ||
          user.name ||
          user.email ||
          "User";

      }


      if (userRole) {

        userRole.textContent =
          user.role ||
          user.jabatan ||
          "PIC";

      }


    } catch (error) {

      console.error(
        "ERROR LOAD USER:",
        error
      );

    }

  }



  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  if (logoutButton) {

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          const response =
            await fetch(
              "/api/logout",
              {
                method: "POST"
              }
            );


          if (!response.ok) {

            throw new Error(
              "Logout gagal"
            );

          }


          window.location.href =
            "/login.html";


        } catch (error) {

          console.error(
            "ERROR LOGOUT:",
            error
          );


          alert(
            "Gagal logout."
          );

        }

      }
    );

  }



  loadSidebarUser();

</script>

 <!-- =====================================================
     USER SIDEBAR + LOGOUT
====================================================== -->
<script src="/layout.js"></script>
<script src="/sidebar.js"></script>

</body>

</html>
