<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kontrak</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-soft: #eef2ff;

      --blue: #2563eb;
      --blue-soft: #eff6ff;

      --success: #059669;
      --success-soft: #ecfdf5;

      --warning: #d97706;
      --warning-soft: #fffbeb;

      --danger: #dc2626;
      --danger-soft: #fef2f2;

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --border: #e2e8f0;
      --border-soft: #f1f5f9;

      --background: #f5f7fb;
      --white: #ffffff;

      --shadow:
        0 1px 2px rgba(15, 23, 42, 0.03),
        0 10px 30px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text-main);
      background:
        radial-gradient(
          circle at top right,
          rgba(79, 70, 229, 0.07),
          transparent 28%
        ),
        var(--background);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================
       HALAMAN
    ========================================= */

    .kontrak-page {
      width: calc(100% - 260px);
      min-height: 100vh;
      margin-left: 260px;
      padding: 24px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .page-title {
      position: relative;
      padding-left: 16px;
    }

    .page-title::before {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 4px;
      background:
        linear-gradient(
          180deg,
          #4f46e5,
          #8b5cf6
        );
      border-radius: 999px;
      content: "";
    }

    .page-title h1 {
      margin: 0;
      color: var(--text-main);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .page-title p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .total-card {
      min-width: 160px;
      padding: 13px 17px;
      color: #ffffff;
      background:
        linear-gradient(
          135deg,
          #4338ca,
          #6366f1
        );
      border-radius: 14px;
      box-shadow:
        0 8px 20px rgba(79, 70, 229, 0.22);
    }

    .total-card span {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.82;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .total-card strong {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    /* =========================================
       FILTER
    ========================================= */

    .filter-card {
      display: grid;
      grid-template-columns:
        minmax(280px, 1fr)
        190px
        210px
        auto;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .filter-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 750;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      height: 40px;
      padding: 8px 11px;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
      outline: none;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .filter-group input::placeholder {
      color: #94a3b8;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .filter-action {
      display: flex;
      align-items: flex-end;
    }

    .reset-button {
      height: 40px;
      padding: 8px 15px;
      color: var(--text-secondary);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 700;
      transition:
        color 0.18s ease,
        background-color 0.18s ease,
        border-color 0.18s ease;
    }

    .reset-button:hover {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: #c7d2fe;
    }

    /* =========================================
       TABLE CARD
    ========================================= */

    .table-card {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .table-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-soft);
    }

    .table-card-header h2 {
      position: relative;
      margin: 0;
      padding-left: 13px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 800;
    }

    .table-card-header h2::before {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 4px;
      background: var(--primary);
      border-radius: 999px;
      content: "";
    }

    .table-card-header span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      scrollbar-color: #cbd5e1 transparent;
      scrollbar-width: thin;
    }

    .table-wrapper::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .table-wrapper::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    table {
      width: 100%;
      min-width: 1050px;
      border-spacing: 0;
      border-collapse: separate;
    }

    thead th {
      padding: 11px 15px;
      color: #64748b;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px;
      font-weight: 800;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.045em;
      white-space: nowrap;
    }

    tbody td {
      padding: 13px 15px;
      color: #334155;
      background: #ffffff;
      border-bottom: 1px solid #edf2f7;
      font-size: 12.5px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover td {
      background: #f8faff;
    }

    .project-name {
      color: var(--text-main);
      font-weight: 750;
    }

    .relation-name {
      color: #334155;
      font-weight: 650;
    }

    .date-text {
      color: #475569;
      white-space: nowrap;
    }

    /* =========================================
       BADGE KLIEN/PARTNER
    ========================================= */

    .relation-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
    }

    .relation-klien {
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .relation-partner {
      color: #7c3aed;
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
    }

    /* =========================================
       BADGE BERAKHIR
    ========================================= */

    .completed-badge,
    .expired-badge,
    .today-badge,
    .warning-badge,
    .active-badge,
    .empty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    /*
     * Kontrak selesai berwarna biru.
     */
    .completed-badge {
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .expired-badge {
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #fecaca;
    }

    .today-badge {
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }

    .warning-badge {
      color: #c2410c;
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .active-badge {
      color: var(--success);
      background: var(--success-soft);
      border: 1px solid #a7f3d0;
    }

    .empty-badge {
      color: #64748b;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .completed-badge::before,
    .expired-badge::before,
    .today-badge::before,
    .warning-badge::before,
    .active-badge::before {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      content: "";
    }

    /* =========================================
       EMPTY DAN LOADING
    ========================================= */

    .table-message {
      padding: 45px 20px !important;
      color: var(--text-muted) !important;
      text-align: center;
    }

    /* =========================================
       PAGINATION
    ========================================= */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 18px;
      background: #ffffff;
      border-top: 1px solid var(--border-soft);
    }

    .pagination-info {
      color: var(--text-muted);
      font-size: 12px;
    }

    .pagination-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .page-button {
      min-width: 36px;
      height: 34px;
      padding: 6px 11px;
      color: #475569;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .page-button:hover:not(:disabled) {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: #c7d2fe;
    }

    .page-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .page-number {
      min-width: 100px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 1100px) {
      .filter-card {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .kontrak-page {
        width: 100%;
        margin-left: 0;
        padding: 16px;
      }
    }

    @media (max-width: 650px) {
      .page-header {
        align-items: stretch;
        flex-direction: column;
      }

      .total-card {
        width: 100%;
      }

      .filter-card {
        grid-template-columns: 1fr;
      }

      .filter-action,
      .reset-button {
        width: 100%;
      }

      .pagination {
        align-items: stretch;
        flex-direction: column;
      }

      .pagination-actions {
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div id="sidebarContainer"></div>

  <main class="kontrak-page">
    <header class="page-header">
      <div class="page-title">
        <h1>Kontrak</h1>

        <p>
          Monitoring periode kontrak klien dan partner.
        </p>
      </div>

      <div class="total-card">
        <span>Total kontrak</span>

        <strong id="totalKontrak">
          0
        </strong>
      </div>
    </header>

    <!-- =========================================
         FILTER
    ========================================== -->

    <section class="filter-card">
      <div class="filter-group">
        <label for="searchKontrak">
          Cari kontrak
        </label>

        <input
          type="search"
          id="searchKontrak"
          placeholder="Cari proyek atau nama klien/partner..."
          autocomplete="off"
        >
      </div>

      <div class="filter-group">
        <label for="filterJenis">
          Klien/Partner
        </label>

        <select id="filterJenis">
          <option value="">
            Semua
          </option>

          <option value="Klien">
            Klien
          </option>

          <option value="Partner">
            Partner
          </option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterStatus">
          Status kontrak
        </label>

        <select id="filterStatus">
          <option value="">
            Semua
          </option>

          <option value="berjalan">
            Masih Berjalan
          </option>

          <option value="berakhir">
            Telah Berakhir
          </option>

          <option value="selesai">
            Kontrak Telah Selesai
          </option>
        </select>
      </div>

      <div class="filter-action">
        <button
          type="button"
          class="reset-button"
          id="resetFilter"
        >
          Reset Filter
        </button>
      </div>
    </section>

    <!-- =========================================
         LISTING KONTRAK
    ========================================== -->

    <section class="table-card">
      <div class="table-card-header">
        <h2>Daftar Kontrak</h2>

        <span id="tableSummary">
          Memuat data...
        </span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nama Proyek</th>

              <th>
                Klien/Partner
              </th>

              <th>
                Nama Klien/Partner
              </th>

              <th>
                Tanggal Mulai
              </th>

              <th>
                Tanggal Akhir
              </th>

              <th>
                Berakhir Pada
              </th>
            </tr>
          </thead>

          <tbody id="kontrakTableBody">
            <tr>
              <td
                colspan="6"
                class="table-message"
              >
                Memuat data kontrak...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- =====================================
           PAGINATION
      ====================================== -->

      <div class="pagination">
        <div
          class="pagination-info"
          id="paginationInfo"
        >
          Menampilkan 0 data
        </div>

        <div class="pagination-actions">
          <button
            type="button"
            class="page-button"
            id="prevPage"
          >
            Sebelumnya
          </button>

          <span
            class="page-number"
            id="pageInfo"
          >
            Halaman 1
          </span>

          <button
            type="button"
            class="page-button"
            id="nextPage"
          >
            Berikutnya
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="/layout.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/kontrak.js"></script>
</body>
</html>
