<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#def5ff">
  <title>Login | ProjectFlow</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    body.projectflow-login {
      margin: 0;
      padding: 0;
      display: block;
      width: 100%;
      max-width: none;
      min-height: 100vh;
      background: #cceeff;
      color: #08234d;
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    }

    .login-page, .login-page * { box-sizing: border-box; }

    .login-page {
      width: 100%;
      min-height: 100vh;
      min-height: max(800px, 100svh);
      display: grid;
      grid-template-columns: 56% 44%;
      background: #cceeff url("/images/login.png") center bottom / cover no-repeat;
    }

    .login-hero {
      min-width: 0;
      padding: clamp(32px, 4.5vw, 76px);
    }

    .login-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #08234d;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.2;
    }

    .login-brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 43px;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      background: #087cff;
      color: #fff;
    }

    .login-brand-mark svg { width: 27px; height: 27px; }
    .login-hero-content { margin-top: clamp(30px, 4vw, 60px); }

    .login-hero-content h1 {
      margin: 0 0 18px;
      color: #08234d;
      font-size: clamp(36px, 3.8vw, 70px);
      font-weight: 800;
      line-height: 1.13;
      letter-spacing: -1.8px;
    }

    .login-hero-content h1 span { display: block; color: #16851b; }

    .login-hero-content p {
      max-width: 570px;
      margin: 0;
      color: #173d63;
      font-size: clamp(15px, 1.25vw, 20px);
      font-weight: 500;
      line-height: 1.7;
    }

    .login-area {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px clamp(24px, 3vw, 56px) 40px 12px;
    }

    .login-page .login-card {
      width: 100%;
      max-width: 490px;
      margin: 0;
      padding: clamp(28px, 3vw, 46px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 18px 56px rgba(12, 80, 125, .12);
    }

    .login-mobile-brand { display: none; }

    .login-sun {
      display: block;
      width: 48px;
      height: 48px;
      margin-bottom: 17px;
      color: #ffbf35;
    }

    .login-card h2 {
      margin: 0 0 12px;
      color: #08234d;
      font-size: clamp(26px, 2.25vw, 35px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1px;
    }

    .login-description {
      margin: 0 0 30px;
      color: #58708a;
      font-size: 14px;
      line-height: 1.8;
    }

    .login-page #loginForm { display: block; margin: 0; padding: 0; }
    .login-group { margin: 0 0 21px; }

    .login-group label {
      display: block;
      margin: 0 0 9px;
      color: #183858;
      font-size: 14px;
      font-weight: 700;
    }

    .login-input-wrap { position: relative; }

    .login-input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 21px;
      height: 21px;
      transform: translateY(-50%);
      color: #7796b5;
      pointer-events: none;
    }

    .login-page .login-group input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 56px;
      margin: 0;
      padding: 0 16px 0 48px;
      border: 1px solid #c9dded;
      border-radius: 13px;
      background: #fbfdff;
      color: #123658;
      font: inherit;
      font-size: 16px;
      transition: border-color .18s, box-shadow .18s;
    }

    .login-page .login-group input::placeholder { color: #7e92a7; opacity: 1; }
    .login-page .login-group input:focus {
      border-color: #147dff;
      outline: 2px solid #147dff;
      outline-offset: 2px;
      box-shadow: 0 0 0 5px rgba(20, 125, 255, .08);
    }
    .login-page .login-group #password { padding-right: 58px; }

    .login-password-toggle {
      position: absolute;
      top: 6px;
      right: 6px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #688aa9;
      cursor: pointer;
    }
    .login-password-toggle:hover { background: #eaf5ff; color: #0875ed; }
    .login-password-toggle svg { width: 22px; height: 22px; }
    .login-password-toggle .eye-slash { display: none; }
    .login-password-toggle[aria-pressed="true"] .eye-slash { display: block; }

    .login-page .login-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
      min-height: 56px;
      margin: 7px 0 0;
      padding: 14px 20px;
      border: 0;
      border-radius: 13px;
      background: #087bfa;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, box-shadow .18s;
    }
    .login-button svg { width: 21px; height: 21px; }
    .login-page .login-button:hover { background: #0568db; box-shadow: 0 6px 18px #087bfa26; }
    .login-page .login-button:disabled { opacity: .65; cursor: wait; box-shadow: none; }
    .login-page button:focus-visible { outline: 3px solid #073e91; outline-offset: 3px; }

    .login-error {
      display: none;
      margin: 0 0 20px;
      padding: 13px 15px;
      border: 1px solid #fecaca;
      border-radius: 12px;
      background: #fff1f2;
      color: #b42336;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .login-card-footer {
      margin: 28px 0 0;
      color: #6d849b;
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 1100px) and (min-width: 901px) {
      .login-page { grid-template-columns: 52% 48%; }
      .login-hero { padding: 36px 26px; }
      .login-hero-content h1 { font-size: 38px; letter-spacing: -1.2px; }
      .login-area { padding: 32px 24px 32px 12px; }
      .login-page .login-card { padding: 30px; }
    }

    @media (max-width: 900px) {
      .login-page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        padding: 28px 18px;
        background-image: linear-gradient(#eaf8ffb8, #eaf8ffb8), url("/images/login.png");
        background-position: center, left bottom;
      }
      .login-hero { display: none; }
      .login-area { width: 100%; padding: 0; }
      .login-page .login-card { max-width: 460px; padding: 32px; border-radius: 25px; }
      .login-mobile-brand { display: inline-flex; margin-bottom: 28px; font-size: 23px; }
      .login-mobile-brand .login-brand-mark { width: 36px; height: 36px; flex-basis: 36px; border-radius: 10px; }
      .login-sun { width: 38px; height: 38px; margin-bottom: 14px; }
    }

    @media (max-width: 380px) {
      .login-page { padding: 18px 12px; }
      .login-page .login-card { padding: 26px 20px; }
      .login-card h2 { font-size: 27px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-page input, .login-page button { transition: none; }
    }

  </style>
</head>

<body class="projectflow-login">
  <main class="login-page">
    <section class="login-hero" aria-labelledby="loginHeroTitle">
      <div class="login-brand">
        <span class="login-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M25 6C15 6 7 9 7 18c0 5 4 8 9 6 7-3 9-11 9-18Z" fill="currentColor"/><path d="m6 27 13-13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
        Bisboard
      </div>

      <div class="login-hero-content">
        <h1 id="loginHeroTitle">Proyek tertata.<span>Tim makin kompak.</span></h1>
        <p>Kelola proyek, kontrak, dan tim dalam satu workspace.</p>
      </div>
    </section>

    <section class="login-area" aria-labelledby="loginTitle">
      <div class="login-card">
        <div class="login-brand login-mobile-brand">
          <span class="login-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M25 6C15 6 7 9 7 18c0 5 4 8 9 6 7-3 9-11 9-18Z" fill="currentColor"/><path d="m6 27 13-13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </span>
         Bisboard
        </div>

        <svg class="login-sun" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="10" fill="currentColor"/>
          <path d="M24 3v5m0 32v5M3 24h5m32 0h5M9 9l4 4m22 22 4 4M9 39l4-4m22-22 4-4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>

        <h2 id="loginTitle">Selamat datang!</h2>
        <p id="loginDescription" class="login-description">Masuk menggunakan email yang terdaftar pada akun PIC.</p>
        <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>

        <form id="loginForm" aria-describedby="loginDescription">
          <div class="login-group">
            <label for="email">Email</label>
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input type="email" id="email" name="email" placeholder="nama@pnmdigi.co.id" autocomplete="email" autocapitalize="none" spellcheck="false" required>
            </div>
          </div>

          <div class="login-group">
            <label for="password">Password</label>
            <div class="login-input-wrap">
              <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" stroke-linecap="round"/></svg>
              <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
              <button type="button" id="togglePassword" class="login-password-toggle" aria-label="Tampilkan password" aria-controls="password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="login-button" id="loginButton">
            <span>Masuk</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <p class="login-card-footer">Semangat baru, kolaborasi lebih seru.</p>
      </div>
    </section>
  </main>

  <script src="/login.js"></script>
  <script>
    (() => {
      const button = document.getElementById("togglePassword");
      const password = document.getElementById("password");

      button.addEventListener("click", () => {
        const isVisible = password.type === "password";
        password.type = isVisible ? "text" : "password";
        button.setAttribute("aria-pressed", String(isVisible));
        button.setAttribute("aria-label", isVisible ? "Sembunyikan password" : "Tampilkan password");
      });
    })();
  </script>
</body>
</html>
